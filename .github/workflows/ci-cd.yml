name: Secure DevOps CI/CD Pipeline (dev)

on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

concurrency:
  # Group by the TARGET branch so every run aimed at dev shares one group:
  #
  #   pull_request -> github.base_ref = "dev"  -> ci-cd-dev
  #   push to dev  -> github.ref_name = "dev"  -> ci-cd-dev
  #
  # With github.ref instead, a PR run used refs/pull/N/merge and a push used
  # refs/heads/dev -- two different groups, so merging or approving a PR let
  # both pipelines run side by side (the duplicate-pipeline problem).
  group: ci-cd-${{ github.base_ref || github.ref_name }}
  # A merge/approve push cancels the superseded PR run; a new commit cancels
  # the older one. Only one dev pipeline runs at a time.
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: PULL REQUEST VALIDATION
  # =========================================================================
  pr-validation:
    name: "Stage 1: PR Description Format Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate Markdown Template Structural Anchors
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body;
            if (!body) {
              core.setFailed("PR Description is completely empty. Please fill out the mandatory template.");
              return;
            }

            const mandatoryHeaders = [
              "## Pull Request",
              "### 1. What this PR does / why we need it:",
              "### Type of change:",
              "Bug fix (non-breaking change that fixes an issue)",
              "New feature (non-breaking change that adds functionality)",
              "Refactoring (no functional changes)",
              "Documentation update",
              "CI/CD pipeline change",
              "Configuration change",
              "### 2. Does this change include any breaking changes?",
              "### 3. Target Release:",
              "### 4. Schema Migrations:",
              "### 5. Unit and Integration Test Coverage:",
              "### 6. Test instructions:"
            ];

            const missingElements = mandatoryHeaders.filter(element => !body.includes(element));

            if (missingElements.length > 0) {
              core.setFailed(
                `PR validation failed. Do not alter or delete the mandatory structural headers. Missing elements:\n${missingElements.join('\n')}`
              );
            }

  # =========================================================================
  # STAGE 2: COMPLIANCE CHECK (FOLDER STRUCTURE VALIDATION)
  # =========================================================================
  compliance-check:
    name: "Stage 2: Directory Structure Compliance"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Verify Mandatory Workspace Partitions
        run: |
          echo "Verifying mandatory root partitions..."

          test -d frontend || (
            echo "❌ Compliance Break: Root directory missing mandatory 'frontend/' folder" &&
            exit 1
          )

          test -d backend || (
            echo "❌ Compliance Break: Root directory missing mandatory 'backend/' folder" &&
            exit 1
          )

          echo "Verifying React MVVM Structural Directories..."

          test -d frontend/src/ui || (
            echo "❌ Compliance Break: Missing 'frontend/src/ui/'" &&
            exit 1
          )

          test -d frontend/src/ui/navigations || (
            echo "❌ Compliance Break: Missing 'frontend/src/ui/navigations/'" &&
            exit 1
          )

          test -d frontend/src/ui/screens || (
            echo "❌ Compliance Break: Missing 'frontend/src/ui/screens/'" &&
            exit 1
          )

          test -d frontend/src/ui/reusables || (
            echo "❌ Compliance Break: Missing 'frontend/src/ui/reusables/'" &&
            exit 1
          )

          test -d frontend/src/services || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/'" &&
            exit 1
          )

          test -d frontend/src/services/bff || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/bff/'" &&
            exit 1
          )

          test -d frontend/src/services/generated || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/generated/'" &&
            exit 1
          )

          test -d frontend/src/services/screens || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/screens/'" &&
            exit 1
          )

          test -d frontend/src/services/domains || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/domains/'" &&
            exit 1
          )

          test -d frontend/src/services/platform || (
            echo "❌ Compliance Break: Missing 'frontend/src/services/platform/'" &&
            exit 1
          )

          test -d frontend/src/types || (
            echo "❌ Compliance Break: Missing 'frontend/src/types/'" &&
            exit 1
          )

          test -d frontend/src/helpers || (
            echo "❌ Compliance Break: Missing 'frontend/src/helpers/'" &&
            exit 1
          )

          test -d frontend/src/assets || (
            echo "❌ Compliance Break: Missing 'frontend/src/assets/'" &&
            exit 1
          )

          echo "Verifying FastAPI Layered Architecture Directories..."

          test -d backend/src/routes || (
            echo "❌ Compliance Break: Missing 'backend/src/routes/'" &&
            exit 1
          )

          test -d backend/src/middleware || (
            echo "❌ Compliance Break: Missing 'backend/src/middleware/'" &&
            exit 1
          )

          test -d backend/src/services || (
            echo "❌ Compliance Break: Missing 'backend/src/services/'" &&
            exit 1
          )

          test -d backend/src/repositories || (
            echo "❌ Compliance Break: Missing 'backend/src/repositories/'" &&
            exit 1
          )

          test -d backend/src/repositories/schema || (
            echo "❌ Compliance Break: Missing 'backend/src/repositories/schema/'" &&
            exit 1
          )

          test -d backend/src/models || (
            echo "❌ Compliance Break: Missing 'backend/src/models/'" &&
            exit 1
          )

          test -d backend/src/client || (
            echo "❌ Compliance Break: Missing 'backend/src/client/'" &&
            exit 1
          )

          test -d backend/src/utils || (
            echo "❌ Compliance Break: Missing 'backend/src/utils/'" &&
            exit 1
          )

          test -d backend/src/utils/exceptions || (
            echo "❌ Compliance Break: Missing 'backend/src/utils/exceptions/'" &&
            exit 1
          )

          echo "Verifying Mandatory Root Files & Mirror Testing Layout..."

          test -d backend/tests || (
            echo "❌ Compliance Break: Missing mandatory root-level 'backend/tests/' folder" &&
            exit 1
          )

          test -f backend/main.py || (
            echo "❌ Compliance Break: Missing application entry point 'backend/main.py'" &&
            exit 1
          )

          test -f backend/src/settings.py || (
            echo "❌ Compliance Break: Missing mandatory 'backend/src/settings.py'" &&
            exit 1
          )

          test -f backend/src/__init__.py || (
            echo "❌ Compliance Break: Missing mandatory 'backend/src/__init__.py'" &&
            exit 1
          )

          echo "✅ All directory and file compliance checks passed successfully according to standard specifications."

  # =========================================================================
  # STAGE 3: LINTING (React ESLint + Python Ruff)
  # =========================================================================
  code-linting:
    name: "Stage 3: Code Linting & Quality Verification"
    needs: [compliance-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Codebase
        uses: actions/checkout@v4

      # Frontend (React) Environment Setup & ESLint
      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Execute React ESLint
        run: |
          cd frontend

          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            # --no-install forces use of the project's local ESLint
            # instead of npx downloading a random version
            npx --no-install eslint . --max-warnings=0
          else
            echo "⚠️ Notice: package.json missing in frontend directory. Skipping ESLint step."
          fi

      # Backend (Python) Environment Setup & Ruff
      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Explicitly Download and Install Ruff Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Execute Ruff Quality Formatting Terminal Checks
        run: |
          cd backend
          ruff check src/
          ruff format --check src/

  # =========================================================================
  # STAGE 4: CODE COVERAGE (AUTOMATED PYTEST & FLOOR RULES)
  # =========================================================================
  code-coverage:
    name: "Stage 4: Automated Testing & 75% Coverage Floor"
    needs: [code-linting]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Dependencies come from uv.lock, the same lockfile the backend image and
      # local development use, so the tested tree is the tree that ships.
      - name: Install uv and Sync Locked Dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Execute Test Coverage Verification Logic
        run: |
          cd backend

          uv sync --frozen

          uv run python -m pytest --cov=src --cov-report=term-missing tests/

          COVERAGE=$(uv run python -m coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')

          echo "Current Calculated System Code Coverage Metrics: $COVERAGE%"

          if [ "$COVERAGE" -lt 75 ]; then
            echo "❌ Pipeline Interrupted: Application testing code coverage ($COVERAGE%) drops below the 75% minimum floor constraint!"
            exit 1
          fi

          echo "✅ Code coverage compliance matches target rules."

  # =========================================================================
  # STAGE 5: SECRETS-CODE-DOCKERFILE-SCAN
  # =========================================================================
  secrets-code-dockerfile-scan:
    name: "Stage 5: Secrets Code & Dockerfile Scan"
    needs: [code-coverage]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks for Code Secret Identification
      - name: Explicitly Download and Install Gitleaks CLI Tool
        run: |
          VERSION="8.30.1"

          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"

          tar -zxf gitleaks.tar.gz gitleaks

          sudo mv gitleaks /usr/local/bin/

          rm gitleaks.tar.gz

      # `gitleaks git` walks every commit in the checked-out history. The older
      # `gitleaks detect` alias silently ignored the [allowlists] section in
      # .gitleaks.toml, so a repository with legitimate documentation matches
      # would fail the build with no way to suppress them.
      - name: Scan Code for Hardcoded Secrets
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks git \
              --config .gitleaks.toml \
              --verbose \
              --log-opts="--all"
          else
            echo "No .gitleaks.toml found, falling back to the built-in rule set."
            gitleaks git \
              --verbose \
              --log-opts="--all"
          fi

      # Hadolint for Dockerfile Rules Configuration Checking
      - name: Explicitly Download and Install Hadolint CLI Tool
        run: |
          sudo curl -sSLo /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"

          sudo chmod +x /usr/local/bin/hadolint

      - name: Scan Dockerfiles for Structural Formatting Flaws
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "Scanning backend/Dockerfile..."
            hadolint backend/Dockerfile --failure-threshold error
          else
            echo "⚠️ Notice: Dockerfile not found in backend/ directory. Skipping."
          fi

          if [ -f frontend/Dockerfile ]; then
            echo "Scanning frontend/Dockerfile..."
            hadolint frontend/Dockerfile --failure-threshold error
          else
            echo "⚠️ Notice: Dockerfile not found in frontend/ directory. Skipping."
          fi

  # =========================================================================
  # STAGE 6 & 7: SECURITY SCANNING (SAST + SCA)
  # =========================================================================
  security-scans:
    name: "Stage 6 & 7: SAST and SCA Security Audits"
    needs: [secrets-code-dockerfile-scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # STAGE 6: SAST (Static Application Security Testing)
      - name: Setup Python for Bandit SAST Scan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and Execute Bandit SAST Analyzer
        run: |
          pip install bandit

          cd backend

          # -x: excludes tests and virtual environments from generating false alerts
          # -lll -iii: fails ONLY on HIGH issues
          # Bandit has no CRITICAL tier
          # Nosec handling remains enabled
          bandit -r src/ -x tests/,migration/,venv/,.venv/ -lll -iii

      # STAGE 7: SCA (Software Composition Analysis - Dependency Vulnerabilities)
      - name: Install Trivy Dependency Scanner CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Execute Trivy SCA Scan on External Dependencies
        run: |
          echo "Auditing Backend Python packages for vulnerabilities..."

          # uv.lock is the single source of truth for backend dependencies.
          if [ -f backend/uv.lock ]; then
            trivy fs \
              --exit-code 0 \
              backend/uv.lock

            trivy fs \
              --exit-code 1 \
              --severity CRITICAL \
              --ignore-unfixed \
              backend/uv.lock
          fi

          echo "Auditing Frontend Node dependencies for vulnerabilities..."

          if [ -f frontend/package-lock.json ]; then
            # Scan the lockfile only, NOT the whole frontend/ folder
            trivy fs \
              --exit-code 0 \
              frontend/package-lock.json

            trivy fs \
              --exit-code 1 \
              --severity CRITICAL \
              --ignore-unfixed \
              frontend/package-lock.json

          elif [ -f frontend/package.json ]; then
            echo "⚠️ Notice: package-lock.json missing in frontend/. Skipping SCA scan for frontend."
          fi

  # =========================================================================
  # STAGE 8: AWS DEPLOYMENT
  #
  # Backend credentials never enter this workflow. ECS injects values from
  # AWS Secrets Manager when tasks start. The frontend receives only public
  # API/WebSocket URLs, which are embedded in its browser bundle.
  # =========================================================================
  deployment-prerequisite:
    name: "Stage 8: AWS OIDC prerequisite (dev)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN == ''
    needs: [security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment is not configured
        run: |
          echo "AWS deployment is skipped because repository variable AWS_DEPLOY_ROLE_ARN is not configured."
          echo "The organization must allow the GitHub OIDC provider and the deployment role must exist before AWS deployment can run."
          {
            echo '### AWS deployment not configured'
            echo 'CI validation completed. Deployment needs the GitHub OIDC provider and `AWS_DEPLOY_ROLE_ARN` repository variable.'
          } >> "$GITHUB_STEP_SUMMARY"

  aws-ecs-deployment:
    name: "Stage 8: Build and deploy to AWS (dev)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [security-scans]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-2
      ECS_CLUSTER: deal-and-drive-dev
      ECS_SERVICE: deal-and-drive-dev-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: DealAndDriveDevDeploy-${{ github.run_id }}

      - name: Resolve AWS deployment targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          distribution_id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='deal-and-drive dev'].Id | [0]" \
            --output text)"
          distribution_domain="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='deal-and-drive dev'].DomainName | [0]" \
            --output text)"
          frontend_bucket="$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'deal-and-drive-dev-frontend-')].Name | [0]" \
            --output text)"
          if [[ -z "$distribution_id" || "$distribution_id" == "None" || \
                -z "$distribution_domain" || "$distribution_domain" == "None" || \
                -z "$frontend_bucket" || "$frontend_bucket" == "None" ]]; then
            echo "Could not find the Deal and Drive dev CloudFront distribution or frontend bucket." >&2
            exit 1
          fi
          echo "ecr_registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=$distribution_domain" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$frontend_bucket" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.targets.outputs.ecr_registry }}/deal-and-drive-dev-api:${{ github.sha }}

      - name: Register task definition with this commit's image and deploy API
        shell: bash
        env:
          API_IMAGE: ${{ steps.targets.outputs.ecr_registry }}/deal-and-drive-dev-api:${{ github.sha }}
        run: |
          set -euo pipefail
          service_status="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text)"
          if [[ "$service_status" != "ACTIVE" ]]; then
            echo "ECS service $ECS_SERVICE is not provisioned. Publish the image, then enable deploy_api in Terraform after the database is available." >&2
            exit 1
          fi
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)"
          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition --output json > "$RUNNER_TEMP/current-task-definition.json"
          jq --arg image "$API_IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy,
                .deregisteredAt, .deregisteredBy)
            | .containerDefinitions |= map(if .name == "api" then .image = $image else . end)
          ' "$RUNNER_TEMP/current-task-definition.json" > "$RUNNER_TEMP/next-task-definition.json"
          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/next-task-definition.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          subnet_ids_text="$(aws ec2 describe-subnets \
            --filters 'Name=tag:Name,Values=deal-and-drive-dev-app-*' \
            --query 'Subnets[].SubnetId' --output text)"
          read -r -a subnet_ids <<< "$subnet_ids_text"
          if [[ "${#subnet_ids[@]}" -lt 2 ]]; then
            echo "Could not find the two private application subnets for the migration task." >&2
            exit 1
          fi
          subnet_ids_csv="$(IFS=,; echo "${subnet_ids[*]}")"
          api_security_group="$(aws ec2 describe-security-groups \
            --filters 'Name=group-name,Values=deal-and-drive-dev-api' \
            --query 'SecurityGroups[0].GroupId' --output text)"
          if [[ -z "$api_security_group" || "$api_security_group" == "None" ]]; then
            echo "Could not find the ECS API security group for the migration task." >&2
            exit 1
          fi
          migration_task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$task_definition_arn" \
            --network-configuration "awsvpcConfiguration={subnets=[$subnet_ids_csv],securityGroups=[$api_security_group],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)"
          if [[ -z "$migration_task_arn" || "$migration_task_arn" == "None" ]]; then
            echo "ECS did not start the Alembic migration task." >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$migration_task_arn"
          migration_exit_code="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$migration_task_arn" \
            --output json | jq -r '.tasks[0].containers[] | select(.name == "api") | .exitCode')"
          if [[ "$migration_exit_code" != "0" ]]; then
            echo "Database migration failed (container exit code: $migration_exit_code); ECS service was not updated." >&2
            exit 1
          fi
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$task_definition_arn" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Generate public frontend configuration and build
        env:
          VITE_API_BASE_URL: https://${{ steps.targets.outputs.distribution_domain }}/api/v1
          VITE_WS_BASE_URL: wss://${{ steps.targets.outputs.distribution_domain }}/api/v1/ws
        run: |
          python -m pip install --quiet pyyaml
          python scripts/generate_env.py frontend --out frontend/.env.production
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Publish frontend to private S3 origin
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.targets.outputs.frontend_bucket }}/" --delete

      - name: Invalidate CloudFront frontend cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.targets.outputs.distribution_id }}" \
            --paths '/*' >/dev/null

  deployment-notice:
    name: "Stage 8: Deployment runs after merge to dev"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment timing
        run: echo "Pull requests validate the application; AWS deployment runs after a successful push to dev."
