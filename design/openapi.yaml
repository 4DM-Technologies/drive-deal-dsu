                  value:
                    items:
                    - $ref: '#/components/examples/QuoteLeading'
                    - $ref: '#/components/examples/QuoteSecond'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /requests/{request_id}/compare-ids:
    post:
      summary: List request ids eligible for compare
      description: |-
        The compare agent's picker. Returns the buyer's own requests that are
        `open` and not already in the comparison, so the UI can offer valid
        choices without the client guessing at eligibility rules.
      operationId: listComparableRequests
      tags:
