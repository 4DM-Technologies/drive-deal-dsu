# Deal&Drive API contract.
# OpenAPI 3.0.3. Converted from 3.1.0: 3.1's `type: [x, 'null']` unions are
# spelled `type: x` + `nullable: true`, and schema-level `examples` arrays
# became a single `example` (the full value lists live in `description`).
openapi: 3.0.3
info:
  title: Deal&Drive — Reverse Car Marketplace API
  version: 1.1.0
  description: |-
    Backend API for Deal&Drive: a reverse car marketplace where buyers post the
    car they want and dealers compete on price for it.

    Handles:
    - Buyer flows: post a car request, watch the live quote leaderboard, accept a
      quote, track the deal, chat with the dealer.
    - Dealer flows: account with manual approval, geo-filtered request feed, quote
      submission and revision, deal status.
    - Support flows: ticket queue, dealer/agent verification approval, roster.
    - AI flows (buyer only): a streaming advisory agent and a compare agent,
      grounded in the database plus a Crawl4AI web search.

    Conventions:
    - All routes are under /api/v1 (this server URL). The only paths outside it
      are the docs themselves (/api/v1/docs, /api/v1/openapi.json) and the
      /api/v1/ws WebSocket upgrade.
    - **Success responses are envelope-free.** The payload is the resource itself.
      There is no {"success": true, "data": ...} wrapper — the frontend's mock
      client already returns bare objects and that shape is the contract
      (solution-frontend.md §2.1, solution-backend.md §0.2).
    - **Every non-2xx JSON response uses the error envelope**, and nothing else:
        {"error": {"code", "message", "details", "request_id"}}
      `code` is a stable machine-readable string the client branches on.
      `message` is for humans and may be reworded; never parse it.
    - **Money is a JSON string decimal**, e.g. "70229.00" — never a JSON number.
      The client parses once and avoids float arithmetic (solution-frontend.md §7.3).
    - **Nullability is meaningful.** A nullable column serialises as null, never
      omitted and never a sentinel. The client renders null as "not reported".
    - **No embeddings.** Knowledge retrieval is a generated SQLAlchemy ORM query
      against PostgreSQL, plus Crawl4AI for facts the database does not have
      (solution-backend.md §2 Delta 9, §10.3, §10.4).
    - **Audit columns are never client-writable.** created_by / updated_by are
      owned by a database trigger reading app.current_user_id.
    - Server-computed columns are not accepted in request bodies. deal_quotes
      .final_price is a GENERATED column; sending it is a 422.
    - Role guards: buyer, dealer (requires approved verification), support,
      support-admin, admin. The AI surface is **buyer-only** (solution-frontend.md §3.8).
    - Rate limits: auth 5/min per IP, signup 3/hour per email, AI 20/min per
      profile, document upload 30/min per dealer.
  contact:
    name: Deal&Drive Dev Team
servers:
- url: /api/v1
  description: Relative to the host serving this spec.
tags:
- name: Health
- name: Auth
- name: Profiles
- name: Reference
- name: Requests
- name: Dealer Feed
- name: Quotes
- name: Deals
- name: Chat
- name: Documents
- name: Support
- name: Verifications
- name: Members
- name: Inventory
  description: |-
    **Addition beyond `solution-backend.md` §9.** The frontend has an
    inventory page, but §9 never specified dealer listing routes. Modelled
    here against the `cars` table so the contract is not silently absent.
    Confirm the shapes before the backend is built to them.
- name: AI
  description: |-
    **Sera AI — buyer-only LangGraph orchestration.**

    The product presents three understandable AI capabilities: the Sera advisor,
    trusted web research, and offer comparison. Internally the safe `StateGraph`
    uses deterministic triage plus classifier, orchestrator, marketplace knowledge,
    trusted web search, verified-car persistence, response composition, and direct
    reply nodes. Buyer-requirement extraction runs beside eligible chat turns and
    only produces an editable draft; publishing always requires explicit approval.

    Runtime model, reasoning effort, output limits, prompts, and approved graph
    connections are versioned administrator configuration. The environment model is
    only the code baseline. Each LLM call and graph stage is recorded as a trace.

    All endpoints stream over SSE. First event is always `status`. Buyer only.
- name: Administration
  description: |-
    Support-administrator and administrator control plane. Manages immutable
    workflow, prompt, runtime-model, and theme revisions; validates drafts before
    publication; runs isolated streaming previews; inspects AI traces; selects a
    recovery default; and exports a secret-free YAML or JSON repository snapshot.
    Code baselines discovered during startup are recorded as new Developer versions
    without silently replacing an active administrator version.
- name: Realtime
- name: Docs
  description: |-
    Self-documentation. `/openapi.json` is the contract and `/docs` is the UI
    that renders it. Unauthenticated, read-only, and never a business
    resource — keep them out of the buyer and dealer journeys.
security:
- bearer_auth: []
paths:
  /:
    get:
      summary: API banner
      description: |-
        Service name, version and the path to the rendered docs. Useful as a
        cheap "is the right server answering?" probe.
      operationId: getApiRoot
      tags:
      - Health
      responses:
        '200':
          description: Service banner
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - version
                - docs
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  docs:
                    type: string
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Service and DB status (raw — no envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  value:
                    status: ok
                    database: ok
                    version: 1.1.0
                degraded:
                  value:
                    status: degraded
                    database: ok
                    version: 1.1.0
  /health/ready:
    get:
      summary: Readiness probe
      description: |-
        Returns 200 only when the database is reachable, migrations are at head,
        and the Crawl4AI browser is initialised. Used by the container
        orchestrator; a 503 here means the container should not receive traffic.
      operationId: healthReady
      tags:
      - Health
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A dependency is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                migrations_behind:
                  value:
                    status: not_ready
                    database: ok
                    version: 1.1.0
                    reason: alembic head not applied
  /auth/signup/buyer:
    post:
      summary: Buyer signup
      description: |-
        Creates a `profiles` row (role=buyer) and a `users` row with an Argon2id
        password hash, in one transaction. Returns access + refresh tokens.

        The password is never logged. Response is 201.
      operationId: signupBuyer
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerSignupRequest'
            examples:
              valid:
                value:
                  full_name: Adithyaa Anand
                  email: adithyaa.ma@gmail.com
                  phone: '+14695550142'
                  password: sunroof2024
                  terms_accepted: true
                  terms_version: '2026-09-01'
      responses:
        '201':
          description: Buyer created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                created:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: bearer
                    expires_in: 1800
                    profile:
                      $ref: '#/components/examples/BuyerProfile'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /auth/signup/dealer:
    post:
      summary: Dealer signup — pending manual approval
      description: |-
        Creates the profile (role=dealer), a `users` row with
        `is_active = false`, and a `support_verifications` row with
        `category = 'dealer'`, `status = 'pending'` and
        `ticket_id = 'DV<epoch>'`.

        **No tokens are issued.** The account is inert until a support agent
        approves the verification, which flips `users.is_active = true`. The
        client renders a pending state, not a login redirect.
      operationId: signupDealer
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DealerSignupRequest'
            examples:
              valid:
                value:
                  full_name: Rahul Sharma
                  email: rahul01@gmail.com
                  phone: '+14695550143'
                  password: dealer2024x
                  dealership_name: Navee Motors
                  branch_name: Frisco
                  dealer_license: US030202
                  state_id: 0e1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                  address: 4100 Legacy Dr, Frisco, TX
                  website: https://naveemotors.example
                  brand_ids:
                  - 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  terms_accepted: true
                  terms_version: '2026-09-01'
      responses:
        '201':
          description: Dealer created, pending approval (no tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApproval'
              examples:
                pending:
                  value:
                    pending: true
                    role: dealer
                    email: rahul01@gmail.com
                    verification_id: 4cac1879-8502-42ba-8140-d321aba9b77
                    ticket_id: DV1788793917
                    message: Your dealer account is awaiting support review — you'll get an email once
                      it's approved.
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /auth/signup/support:
    post:
      summary: Support agent signup — pending manual approval
      description: |-
        Support team accounts require manual approval.

        Creates the profile (role=support), a `users` row with
        `is_active = false`, and a `support_verifications` row with
        `category = 'agent'`, `status = 'pending'`,
        `ticket_id = 'SA<epoch>'`.

        **No tokens are issued.** Approving an `agent` verification requires the
        `admin` role — a support agent can never approve a peer
        (solution-backend.md §9.5).

        This route is **not linked from public navigation** and is reachable by
        direct URL only. The UI hiding is cosmetic; the real control is that the
        account is inert until approved.
      operationId: signupSupport
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportSignupRequest'
            examples:
              valid:
                value:
                  full_name: Support03
                  phone: '+14695550144'
                  address: 2200 Ross Ave, Dallas, TX
                  state_id: 0e1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                  extra_info: Former dealership service manager, 6 years.
                  email: support03@gmail.com
                  password: support2024
                  terms_accepted: true
                  terms_version: '2026-09-01'
      responses:
        '201':
          description: Agent created, pending approval (no tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingApproval'
              examples:
                pending:
                  value:
                    pending: true
                    role: support
                    email: support03@gmail.com
                    verification_id: b1e876b4-da1f-41e6-9eaf-1955cf13af4f
                    ticket_id: SA97379
                    message: Your support account is pending approval. Our team reviews every request
                      — you'll get an email once it's approved.
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /auth/login:
    post:
      summary: Login
      description: |-
        One login for all roles — the role is read from the session, never
        selected by the user.

        - Wrong password, or an unknown email → 401 INVALID_CREDENTIALS. A dummy
          Argon2id verify runs on unknown emails so response time does not
          enumerate accounts.
        - `users.is_active = false` with a pending verification → 403
          DEALER_PENDING_REVIEW (or SUPPORT_PENDING_REVIEW). This one deliberate
          distinction is the only difference in the response.
        - A suspended account is 403 with code FORBIDDEN_ROLE.
      operationId: login
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              buyer:
                value:
                  email: rahul01@gmail.com
                  password: sunroof2024
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
              examples:
                ok:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: bearer
                    expires_in: 1800
                    profile:
                      $ref: '#/components/examples/BuyerProfile'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/pending_review'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /auth/refresh:
    post:
      summary: Refresh the access token
      description: |-
        Rotates the refresh token's `jti`. Presenting a rotated (already used)
        token revokes the whole family — replay detection, not a silent reissue.
      operationId: refreshToken
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/unauthorized'
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      tags:
      - Auth
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signed out
        '401':
          $ref: '#/components/responses/unauthorized'
  /auth/forgot-password:
    post:
      summary: Request a password reset
      description: |-
        **Always 202**, whether or not the email exists. Returning 202 for both
        is what prevents account enumeration.
      operationId: forgotPassword
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Accepted regardless of whether the email exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If that email has an account, a reset link is on its way.
        '429':
          $ref: '#/components/responses/rate_limited'
  /auth/reset-password:
    post:
      summary: Complete a password reset
      description: Hashes with Argon2id and revokes every existing session for the profile.
      operationId: resetPassword
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                  description: Single-use reset token from the email link
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated. Sign in with your new password.
        '400':
          $ref: '#/components/responses/invalid_token'
        '422':
          $ref: '#/components/responses/validation_error'
  /auth/me:
    get:
      summary: Current session profile
      description: |-
        Profile plus role plus verification status. The client routes on `role`;
        there is no role picker in the UI.
      operationId: getCurrentUser
      tags:
      - Auth
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              examples:
                buyer:
                  value:
                    $ref: '#/components/examples/MeBuyer'
        '401':
          $ref: '#/components/responses/unauthorized'
  /profiles/me:
    get:
      summary: Get my profile
      operationId: getMyProfile
      tags:
      - Profiles
      responses:
        '200':
          description: Profile row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
    patch:
      summary: Update my profile
      description: |-
        PATCH semantics — only the keys you send change. Omitted keys keep their
        current value; sending an explicit `null` clears the field where the
        column is nullable.

        `role`, `verification_status` and every audit column are rejected with
        422 if present. To become a dealer, POST /auth/signup/dealer instead.
      operationId: updateMyProfile
      tags:
      - Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
            examples:
              name_and_avatar:
                value:
                  full_name: Rahul S.
                  avatar_url: https://cdn.drivedeal.example/avatars/rahul.png
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_error'
  /profiles/me/preferences:
    get:
      summary: Get my car preferences
      description: |-
        One row per buyer (`buyer_preference.profile_id` is both PK and FK), or
        404 when the buyer has not stated preferences yet — absence is the
        "no filtering" default, not an empty object.
      operationId: getMyPreferences
      tags:
      - Profiles
      responses:
        '200':
          description: Stored preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPreference'
        '404':
          $ref: '#/components/responses/not_found'
        '401':
          $ref: '#/components/responses/unauthorized'
    put:
      summary: Set or replace my car preferences
      description: |-
        Upsert on `profile_id` — a full replacement, not a merge. Every nullable
        column you omit becomes NULL, and a NULL column is a wildcard in
        matching, so a partial PATCH here would silently widen the buyer's
        filters. Send the whole object.

        `source` is `manual` when the buyer fills the form. The AI intake path
        writes `ai_inferred` with a `confidence` — that is a server write, so a
        client sending `ai_inferred` is rejected with 422.
      operationId: setMyPreferences
      tags:
      - Profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyerPreferenceUpsert'
            examples:
              seven_seater_suv:
                value:
                  brand_id: b5a5e627-7f0f-4d6f-a7e5-1b2c3d4e5f60
                  other_brand_ids:
                  - c6d7e8f9-0a1b-4c2d-8e3f-4a5b6c7d8e9f
                  model_preference: Bronco
                  body_type: SUV
                  seater_count: 7
                  transmission: Automatic
                  drivetrain: AWD
                  fuel_type: Petrol
                  condition: Used
                  exterior_color: Blue
                  min_year: 2021
                  max_mileage: 60000
                  budget_min: 40000
                  budget_max: 65000
                  must_have_features:
                  - sunroof
                  - leather
                  - apple_carplay
                  never_want_features:
                  - manual_transmission
      responses:
        '200':
          description: Preferences stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerPreference'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_error'
  /profiles/{profile_id}:
    get:
      summary: Get a public profile
      description: |-
        Public fields only. Email, phone, verification notes and audit columns
        are never returned to another user. Buyers may read dealers (to judge
        the quote); dealers may read buyers.
      operationId: getProfileById
      tags:
      - Profiles
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Public profile view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found'
  /reference/states:
    get:
      summary: List all states
      description: |-
        Unauthenticated — needed by the signup address form before a session
        exists. 51 rows, served from memory, ~2 KB, so it is not paginated.
      operationId: listStates
      tags:
      - Reference
      security: []
      responses:
        '200':
          description: State reference rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateRef'
              examples:
                first_five:
                  value:
                  - id: 9f2c1b3a-4d5e-4f60-8a7b-9c0d1e2f3a4b
                    name: Alabama
                    code: AL
                    tax_rate: '0.04'
                  - id: 0a1b2c3d-4e5f-4061-8a7b-8c9d0e1f2a3b
                    name: Alaska
                    code: AK
                    tax_rate: '0.00'
                  - id: 1b2c3d4e-5f60-4172-9a8b-9c0d1e2f3a4b
                    name: Arizona
                    code: AZ
                    tax_rate: '0.056'
                  - id: 2c3d4e5f-6071-4283-8b9c-0d1e2f3a4b5c
                    name: Arkansas
                    code: AR
                    tax_rate: '0.065'
                  - id: 3d4e5f60-7182-4394-9c0d-1e2f3a4b5c6d
                    name: California
                    code: CA
                    tax_rate: '0.0725'
  /reference/states/{code}/tax-rate:
    get:
      summary: Get one state's combined tax rate
      description: |-
        Unauthenticated. Drives the OTD estimate on every car, quote and deal
        screen, so it must be reachable before login.
      operationId: getStateTaxRate
      tags:
      - Reference
      security: []
      parameters:
      - name: code
        in: path
        required: true
        description: Two-letter USPS code, case-insensitive
        schema:
          type: string
          minLength: 2
          maxLength: 2
          example: TX
      responses:
        '200':
          description: Tax rate
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - name
                - tax_rate
                properties:
                  code:
                    type: string
                    example: TX
                  name:
                    type: string
                    example: Texas
                  tax_rate:
                    $ref: '#/components/schemas/DecimalString'
                  otd_example:
                    type: string
                    description: OTD for a $70,000 car in this state, tax included
                    example: '70229.00'
        '404':
          $ref: '#/components/responses/not_found'
  /reference/brands:
    get:
      summary: List car brands
      description: |-
        Unauthenticated. Alphabetical, not paginated — this drives a select
        input, not a feed.
      operationId: listBrands
      tags:
      - Reference
      security: []
      responses:
        '200':
          description: Brand reference rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrandRef'
              examples:
                first_four:
                  value:
                  - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    name: Acura
                    country_code: JP
                  - id: 2b3c4d5e-6f70-4182-9a3b-4c5d6e7f8a9b
                    name: Aston Martin
                    country_code: GB
                  - id: 3c4d5e6f-7081-4293-8b4c-5d6e7f8a9b0c
                    name: Audi
                    country_code: DE
                  - id: 4d5e6f70-8192-43a4-9c5d-6e7f8a9b0c1d
                    name: BMW
                    country_code: DE
  /requests:
    post:
      summary: Create a car request
      description: |-
        Buyers describe the car they want; dealers bid on it. Creates a
        `buyer_requests` row in `open` status and copies the buyer's
        `buyer_preference` snapshot onto the row, so later preference edits do
        not silently change what dealers are being asked for.
      operationId: createRequest
      tags:
      - Requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpsert'
            examples:
              seven_seater:
                value:
                  title: 7-seater SUV under 65k
                  description: Looking for a reliable family SUV, third row preferred.
                  state_id: 0e1f2a3b-4c5d-4e6f-8a9b-0c1d2e3f4a5b
                  brand_id: b5a5e627-7f0f-4d6f-a7e5-1b2c3d4e5f60
                  body_type: SUV
                  seater_count: 7
                  min_year: 2021
                  max_mileage: 60000
                  budget_min: '40000.00'
                  budget_max: '65000.00'
                  target_otd: '68000.00'
                  transmission: Automatic
                  drivetrain: AWD
                  fuel_type: Petrol
                  condition: Used
                  exterior_color: Blue
                  must_haves:
                  - sunroof
                  - leather
                  - apple_carplay
                  nice_to_haves:
                  - third_row
                  - heated_seats
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          $ref: '#/components/responses/subscription_required'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_error'
    get:
      summary: List my requests
      description: |-
        Cursor-paginated, newest first. Optional `status` filter. `next_cursor`
        is null on the last page.
      operationId: listMyRequests
      tags:
