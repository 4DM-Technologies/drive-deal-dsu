            format: uuid
          brand_id:
            type: string
            format: uuid
          brand_name:
            type: string
            nullable: true
          state_id:
            type: string
            format: uuid
          title:
            type: string
          model:
            type: string
          body_type:
            allOf:
            - $ref: '#/components/schemas/BodyType'
            nullable: true
          seating_capacity:
            type: integer
            nullable: true
          condition:
            allOf:
            - $ref: '#/components/schemas/CarCondition'
            nullable: true
          mileage:
            type: integer
            nullable: true
          model_year:
            type: integer
          fuel:
            allOf:
            - $ref: '#/components/schemas/FuelType'
            nullable: true
          transmission:
            allOf:
            - $ref: '#/components/schemas/Transmission'
            nullable: true
          price:
            $ref: '#/components/schemas/DecimalString'
          rating:
            type: number
            minimum: 0
            maximum: 5
            description: Cached average of the `reviews` array.
            nullable: true
          reviews:
            type: array
            items:
              $ref: '#/components/schemas/CarReview'
          image_paths:
            type: array
            items:
              type: string
          status:
            $ref: '#/components/schemas/CarStatus'
          created_by:
            type: string
            description: Dealer profile ID that owns the listing.
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    CarList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Car'
        next_cursor:
          type: string
          nullable: true
    AiChatRequest:
      type: object
      required:
      - message
      description: |-
        One turn of the buyer advisory agent. Send `thread_id: null` to start
        a new thread; on every later turn echo the `thread_id` from the
        `done` event. Resuming the same `thread_id` after a dropped
        connection continues from the LangGraph checkpoint rather than
        restarting the turn.
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 8000
        thread_id:
          type: string
          format: uuid
          nullable: true
        agent:
          type: string
          enum:
          - sera-agent
          - compare-agent
          description: |-
            Which agent to route to.
            - `sera-agent`: intent-driven advisor workflow plus eligible parallel
              requirement extraction.
            - `compare-agent`: compares only selected buyer-owned request/offer rows.
            Unknown value → 422 VALIDATION_ERROR. Never silently defaults.
        request_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        quote_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
    AiThread:
      type: object
      required:
      - id
      - title
      - created_at
      - updated_at
      - messages
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        messages:
          type: array
          description: |-
            Ordered turns including the assistant's full written reply. The
            client renders stored prose here — it never replays a stream to
            rebuild history.
          items:
            $ref: '#/components/schemas/AiMessage'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AiMessage:
      type: object
      required:
      - role
      - content
      - created_at
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        cards:
          type: array
          description: Rich result cards the answer referenced. Empty array, never null.
          items:
            $ref: '#/components/schemas/AiCard'
        sources:
          type: array
          description: |-
            Every claim's provenance. A `db` source names the table and row;
            a `web` source names the crawled URL. The client renders these
            as the "sources" affordance so a buyer can check the agent.
          items:
            $ref: '#/components/schemas/SourceRef'
        created_at:
          type: string
          format: date-time
    AiThreadList:
      type: object
      required:
      - items
      description: |-
        The seeded demo buyer has four coherent sessions with full written
        replies, so a new account opens onto a gallery of real conversations
        rather than an empty state.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiThread'
        next_cursor:
          type: string
          nullable: true
    AiCard:
      type: object
      description: |-
        A structured result the answer can render inline. The backend shapes
        these — the client never parses prose to discover a car, a request or
        a price.
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - car
          - request
          - quote
          - deal
        car_id:
          type: string
          format: uuid
          nullable: true
        quote_id:
          type: string
          format: uuid
          nullable: true
        request_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
        price:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        otd:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        dealer_name:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
    SourceRef:
      type: object
      description: |-
        Provenance for one claim. `db` means a PostgreSQL row read through
        the validated ORM query path; `web` means a page fetched by
        Crawl4AI after the database did not answer.

        There is no `vector` or `embedding` type — retrieval is a generated
        SQLAlchemy query plus a web crawl, never a similarity search.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - db
          - web
        table:
          type: string
          description: Present when `type = 'db'`. One of the allowlisted tables.
          example: cars
          nullable: true
        id:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
          example: 2022 Ford Bronco Outer Banks
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        title:
          type: string
          nullable: true
        snippet:
          type: string
          nullable: true
        retrieved_at:
          type: string
          format: date-time
          description: For `web` sources — how stale the crawl can be before the cache is refreshed.
          nullable: true
    AiCompareRequest:
      type: object
      required:
      - request_ids
      properties:
        request_ids:
          type: array
          minItems: 2
          maxItems: 5
          description: |-
            The buyer's own request ids. A single request is 422 — a
            comparison of one thing is not a comparison.
          items:
            type: string
            format: uuid
    ComparisonResult:
      type: object
      description: |-
        The compare agent's renderable output. The frontend builds a table
        from `spec_table` and never parses prose.

        Two rules are contractual, not stylistic:
        - Missing data is `null` and the client shows **"not reported"** —
          never a zero, never a dropped column.
        - Every selected request appears in `requests`, even if all of its
          data is missing. A request that silently vanished from the
          comparison is a bug, not a filter.
      required:
      - requests
      - spec_table
      - price_analysis
      - review_summary
      - recommendation
      - caveats
      - sources
      properties:
        requests:
          type: array
          description: One entry per selected request, in the order they were sent.
          minItems: 2
          items:
            $ref: '#/components/schemas/RequestComparisonRow'
        spec_table:
          type: object
          description: |-
            field → request id → value. A `null` value means not reported.
            Transposed for direct rendering — a row per spec, a column per
            request.
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              nullable: true
          example:
            Seating capacity:
              2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f: '7'
              30655845-5bc4-439d-ad13-02ad86c5bd0a: '5'
            Transmission:
              2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f: Automatic
              30655845-5bc4-439d-ad13-02ad86c5bd0a: null
        price_analysis:
          $ref: '#/components/schemas/PriceAnalysis'
        review_summary:
          $ref: '#/components/schemas/ReviewSummary'
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        caveats:
          type: array
          description: |-
            Every "not reported" gap, as a sentence. An empty array is a real
            result — it means nothing was missing.
          items:
            type: string
          example:
          - The 2021 Highlander does not report its seating capacity.
          - No reviews in KB for the d3f827dc request.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
    RequestComparisonRow:
      type: object
      required:
      - request_id
      - title
      properties:
        request_id:
          type: string
          format: uuid
        title:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/RequestStatus'
          nullable: true
        quote_count:
          type: integer
          minimum: 0
        best_effective_price:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
    PriceAnalysis:
      type: object
      required:
      - best_request_id
      - currency
      properties:
        best_request_id:
          type: string
          format: uuid
          description: Cheapest effective price across the compared requests.
        best_effective_price:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        spread:
          description: Difference between the dearest and cheapest — how much the choice actually matters.
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        vs_target_otd:
          type: array
          description: 'One entry per request: over or under the buyer''s own ceiling.'
          items:
            type: object
            properties:
              request_id:
                type: string
                format: uuid
              best_effective_price:
                allOf:
                - $ref: '#/components/schemas/DecimalString'
                nullable: true
              target_otd:
                allOf:
                - $ref: '#/components/schemas/DecimalString'
                nullable: true
              delta:
                description: Negative means under budget.
                allOf:
                - $ref: '#/components/schemas/DecimalString'
                nullable: true
        vs_budget_max:
          type: array
          items:
            type: object
            properties:
              request_id:
                type: string
                format: uuid
              delta:
                allOf:
                - $ref: '#/components/schemas/DecimalString'
                nullable: true
        currency:
          type: string
          enum:
          - USD
    ReviewSummary:
      type: object
      description: |-
        Sentiment and volume per request, or an explicit "no reviews in KB"
        rather than a null the client has to interpret.
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - request_id
            - review_count
            properties:
              request_id:
                type: string
                format: uuid
              review_count:
                type: integer
                minimum: 0
              average_rating:
                type: number
                minimum: 0
                maximum: 5
                nullable: true
              sentiment:
                type: string
                description: '`mixed` when reviews disagree. `no_reviews_in_kb` is an explicit state,
                  not a null the client has to interpret.'
                enum:
                - positive
                - mixed
                - negative
                - no_reviews_in_kb
                example: positive
              highlights:
                type: array
                items:
                  type: string
    Recommendation:
      type: object
      description: |-
        A recommendation **without visible reasoning is a validation failure**
        — the endpoint returns 422 rather than shipping a bare pick.
      required:
      - request_id
      - reasoning
      - confidence
      properties:
        request_id:
          type: string
          format: uuid
        reasoning:
          type: string
          minLength: 1
          description: Shown verbatim to the buyer. Not summarised or hidden.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |-
            Low when the comparison rests on missing data. A confidence
            below ~0.4 should push the UI to lead with the caveats instead
            of the pick.
          example: 0.78
        runner_up_request_id:
          type: string
          format: uuid
          nullable: true
    AiRequestPreviewResult:
      type: object
      description: |-
        Serra preview cards plus the billing posting gate, so the UI can
        warn *before* the hard 402 on POST /requests instead of after it.
      required:
      - previews
      - confirmation_required
      - posting_allowed
      properties:
        previews:
          type: array
          description: requestPreview card payloads collected from the stream.
          items:
            $ref: '#/components/schemas/AiRequestPreview'
        confirmation_required:
          type: boolean
          example: true
        posting_allowed:
          type: boolean
          description: False when the buyer is at the 3-post free limit or premium expired.
        posting_reason:
          type: string
          nullable: true
          description: '`premium_expired` or `request_limit_reached` when posting_allowed is false.'
        requests_used:
          type: integer
          nullable: true
        request_limit:
          type: integer
          nullable: true
          description: null while premium (unlimited).
    AiRequestPreview:
      type: object
      description: |-
        The intake agent's **preview**. This never creates a published
        request — the buyer edits it, it is saved as `draft`, and only
        POST /requests/{id}/publish can make it live. A test asserts no
        LangGraph node can reach `buyer_requests` with `status = 'open'`.
      required:
      - thread_id
      - complete
      - request
      - missing_fields
      - preference
      properties:
        thread_id:
          type: string
          format: uuid
        complete:
          type: boolean
          description: False while required fields are still missing — the UI keeps asking questions.
        missing_fields:
          type: array
          description: |-
            Names the agent still needs. Empty when complete. The client
            turns each into a follow-up question rather than inventing a
            default.
          items:
            type: string
          example:
          - budget_max
          - state_id
        request:
          $ref: '#/components/schemas/RequestUpsert'
        preference:
          type: object
          required:
          - source
          - confidence
          properties:
            source:
              type: string
              enum:
              - ai_inferred
            confidence:
              type: number
              minimum: 0
              maximum: 1
              example: 0.92
        draft_request_id:
          type: string
          format: uuid
          description: Set once POST /requests/{id}/ai-draft has persisted it.
          nullable: true
  examples:
    BuyerProfile:
      summary: The seeded buyer
      value:
        id: bdc31c9e-f6ed-40d0-a32f-706062f81d77
