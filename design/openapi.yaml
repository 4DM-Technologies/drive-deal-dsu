            properties:
              ts:
                type: string
                format: date-time
              text:
                type: string
              agent:
                type: string
                format: email
        rca:
          type: string
          description: Root-cause analysis, set when the ticket is resolved.
          nullable: true
        assigned_to:
          type: string
          format: uuid
          nullable: true
        sla_due_at:
          type: string
          format: date-time
