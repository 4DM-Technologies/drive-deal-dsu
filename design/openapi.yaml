            it per row.
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
    TicketUpdate:
      type: object
      description: |-
        Body for `PATCH /support/tickets/{id}`. Every field is optional, so the
        patch is a partial update. Note that the response is the full
        `SupportTicket`, not the fields that changed.
      properties:
        status:
          type: string
          enum:
          - open
          - in_progress
          - on_hold
          - resolved
          - closed
