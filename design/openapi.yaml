                        condition: Used
                        exterior_color: null
                        must_haves: []
                        nice_to_haves: []
                      preference:
                        source: ai_inferred
                        confidence: 0.92
                    confirmation_required: true
                    posting_allowed: false
                    posting_reason: request_limit_reached
                    requests_used: 3
