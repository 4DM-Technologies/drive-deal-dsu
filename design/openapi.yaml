        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /feed/requests:
    get:
      summary: Geo-filtered request feed for dealers
      description: |-
        The dealer's core feed. `radius_miles` defaults to 50; `state_id` is an
        additional filter. Matching mirrors the buyer's preference semantics
        exactly — a NULL preference column is a wildcard, so a request the
        dealer satisfies on nothing but state still appears.

        Dealer-only. Support agents get 403 here; their queue is
        /support/queue/tickets.
      operationId: getDealerRequestFeed
      tags:
      - Dealer Feed
      parameters:
      - name: state_id
        in: query
