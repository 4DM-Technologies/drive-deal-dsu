  /ai/chat:
    post:
      summary: Stream an AI answer (SSE)
      description: |-
        Stream a message to the Sera AI advisor.

        **Agent routing**: `agent` routes to the configurable Sera workflow or
        selected-offer comparison. Unknown values return 422.

        **Sera workflow** per eligible turn:
        1. Deterministic triage handles direct replies and explicit current research.
        2. The classifier selects advice, compare, requirements, or off-topic.
        3. The orchestrator selects `kb_only`, `web_direct`, or `web_per_car`.
        4. Marketplace knowledge is queried before optional allow-listed web research.
        5. Complete researched vehicles may be persisted for reuse.
        6. The composer produces the final grounded Markdown response.
        7. Requirement extraction runs in parallel when useful and can emit an
           editable `requestPreview`; it never publishes the request.

        **Streaming events** (SSE, in order):
        - `status {phase, label}` — emitted immediately and before every tool call
        - `token {text}` — incremental, never cumulative
        - `card {kind, payload}` — AICarCard | CompareTable | requestPreview
        - `sources {items}` — provenance URLs
        - `done {thread_id, messages_used, expanded_ui}`

        Prompt text, model, reasoning effort, token limit, and workflow connections
        come from the active versioned administrator configuration.
      operationId: aiChat
      tags:
      - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            examples:
              first_turn:
                value:
                  message: I need a 7-seater SUV under 65k with a sunroof — what's out there?
                  thread_id: null
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: 'A sequence of `event: <type>` / `data: <json>` / blank-line frames.'
              examples:
                full_turn:
                  summary: Database-grounded answer
                  value: |-
                    event: status
                    data: {"phase":"classifying","message":"Reading your requirements"}

                    event: status
                    data: {"phase":"searching","message":"Searching Deal&Drive inventory"}

                    event: status
                    data: {"phase":"composing","message":"Putting it together"}

                    event: token
                    data: {"text":"Based on 12 matching listings, "}

                    event: token
                    data: {"text":"this 2022 Bronco at $47,500 is the closest fit."}

                    event: card
                    data: {"kind":"car","car_id":"00e22c60-88c0-40ef-a12d-365ecbbd4185","title":"2022 Ford Bronco Outer Banks","price":"47500.00","otd":"51020.00","dealer_name":"Navee Motors","rating":4.6}

                    event: sources
                    data: {"items":[{"type":"db","table":"cars","id":"00e22c60-88c0-40ef-a12d-365ecbbd4185","label":"2022 Ford Bronco Outer Banks"},{"type":"web","url":"https://www.edmunds.com/ford/bronco/2022/","title":"2022 Ford Bronco Review","snippet":"The 2022 Bronco adds a 12-inch screen..."}]}

                    event: done
                    data: {"thread_id":"dce16b4b-7c8d-4e9f-a0b1-c2d3e4f5a6b","message_id":"c1d2e3f4-a5b6-4c7d-8e9f-0a1b2c3d4e5f","citations":2}
                web_fallback:
                  summary: Answer that had to crawl the web
                  value: |-
                    event: status
                    data: {"phase":"classifying","message":"Reading your requirements"}

                    event: status
                    data: {"phase":"searching","message":"Searching Deal&Drive inventory"}

                    event: status
                    data: {"phase":"crawling","message":"Checking outside sources"}

                    event: token
                    data: {"text":"Reliability data for the Bronco is thin in our database, "}

                    event: token
                    data: {"text":"so I looked it up — recall history is clean for 2022."}

                    event: sources
                    data: {"items":[{"type":"web","url":"https://www.nhtsa.gov/vehicle/2022/FORD/BRONCO","title":"NHTSA — 2022 Ford Bronco","snippet":"No open recalls reported."}]}

                    event: done
                    data: {"thread_id":"dce16b4b-7c8d-4e9f-a0b1-c2d3e4f5a6b","message_id":"a7b8c9d0-e1f2-4a3b-9c4d-5e6f7a8b9c0d","citations":1}
        '400':
          $ref: '#/components/responses/invalid_token'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '429':
          $ref: '#/components/responses/rate_limited'
