  /ai/compare:
    post:
      summary: Compare several requests (structured)
      description: |-
        The compare agent, **buyer-only**. Returns a structured
        `ComparisonResult` the frontend renders as a table — it never parses
        prose to build the grid.

        Rules baked into the contract:
        - Missing data is `null` and renders as **"not reported"** — never a
          zero and never an omitted column.
        - Every selected request appears, even if all of its data is missing.
        - A recommendation without visible reasoning is a 422 validation failure
          on our side, not a client concern.

        Reads the database via the same validated ORM query path as /ai/chat and
        falls back to Crawl4AI, so the tool is the only retrieval path. Runs on
        a Celery-style background task; poll the result, or stream over WS.
      operationId: aiCompare
      tags:
      - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCompareRequest'
            examples:
              three_way:
                value:
                  request_ids:
                  - 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                  - 30655845-5bc4-439d-ad13-02ad86c5bd0a
                  - d3f827dc-9744-4601-a80f-73dc5b1d60cd
      responses:
        '200':
          description: Comparison result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResult'
        '400':
          $ref: '#/components/responses/invalid_token'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /ai/guided/next:
    post:
      summary: Next question of the guided question card
      description: |-
        **Buyer-only.** Deterministic, no LLM call. The client sends back the planner's `answers` from the previous
        step plus one action, and receives the next question (numbered options, free-text allowed, skippable,
        "index of total") or, once every question is answered, the finished request `draft` for the review card.
        Every value in `answers` is re-validated against the vehicle catalog on each call. Budget is only asked when
        the buyer mentions money. `unresolved: true` means typed text was a question for Sera, not an answer.
      operationId: aiGuidedNext
      tags:
      - AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  description: Opaque planner state from the previous response. Start with {"entry":"button"} or {"entry":"explore"}.
                  additionalProperties: true
                action:
                  type: object
                  required: [type]
                  properties:
                    type: {type: string, enum: [resume, answer, skip, back]}
                    question_id: {type: string}
                    values: {type: array, items: {type: string}, maxItems: 12}
                    text: {type: string, maxLength: 500}
            examples:
              start:
                value: {answers: {entry: button}, action: {type: resume}}
      responses:
        '200':
          description: The next question, or the finished draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  answers: {type: object, additionalProperties: true}
                  question:
                    type: object
                    nullable: true
                    properties:
                      id: {type: string}
                      title: {type: string}
                      options:
                        type: array
                        items:
                          type: object
                          properties:
                            value: {type: string}
                            label: {type: string}
                            description: {type: string, nullable: true}
                      allow_other: {type: boolean}
                      other_placeholder: {type: string}
                      multi_select: {type: boolean}
                      skippable: {type: boolean}
                      index: {type: integer}
                      total: {type: integer}
                  draft: {type: object, nullable: true, additionalProperties: {type: string}}
                  message: {type: string, nullable: true}
                  unresolved: {type: boolean}
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_error'
  /ai/request-preview:
    post:
      summary: Preview an AI-drafted request
      description: |-
        The intake agent's **preview** step — it never writes a published
        request. Returns a draft for the buyer to confirm, edit, then persist
        with POST /requests/{id}/ai-draft and publish with
        POST /requests/{id}/publish. The agent's write surface to
        buyer_requests is `draft` status only.
      operationId: aiRequestPreview
      tags:
