  /ws:
    get:
      summary: Realtime event stream (WebSocket)
      description: |-
        **Not a REST endpoint and not an OpenAPI-conformant operation** — it is
        documented here because the client depends on it, and is flagged with
        `x-websocket: true` because OpenAPI has no WebSocket primitive.

        Upgrade `GET /api/v1/ws?ticket=<one-shot ticket>` where the ticket comes
        from POST /chats/ws-ticket. The ticket is single-use and expires in 60 s.
        This is the single socket for the whole app; a conversation is not a
        separate connection.

        ### Server → client frames

        JSON objects with a `type` discriminator. Every frame also carries
        `seq` (monotonic per socket) and `at` (ISO-8601) so a client can detect
        gaps.

        - `chat_message` — a new message in a quote chat. Carries the full
          `ChatMessage`; the client upserts by `id`, which makes retries and
          out-of-order delivery harmless.
        - `chat_request` — a chat access request changed. Sent to the dealer on
          creation, and to the buyer when the dealer accepts or declines.
          Carries the full `ChatAccessRequest`, so the dealer inbox updates
          without a refetch.
        - `chat_read` — the other side read up to a message. Carries
          `quote_id` and `last_read_message_id`.
        - `leaderboard_updated` — a request's quotes were re-ranked by the §4.4
          rules after a create, revise, expiry, or acceptance. Carries
          `request_id` and the same `QuoteSummary[]` as
          `GET /requests/{id}/quotes`. **Buyer-only** — it exposes dealer
          pricing, so it is never pushed to other dealers.
        - `deal_status` — a deal's status changed; carries the full `DealSummary`
          and history entry so a second tab cannot show a stale state.
        - `quote_update` — a quote was created, revised, withdrawn, accepted or
          declined. Carries the full `QuoteSummary`, so one frame type covers
          what used to be a separate `quote.status`.
        - `request_update` — a request in the dealer's feed changed.
        - `heartbeat` — every 30 s, so an idle socket is not reaped by a proxy.

        ### Client → server frames

        - `chat.send` — `{ id, quote_id, message }`. Delegates to the same
          service as POST /chats/{quote_id} so authorization, dedupe, and
          persistence cannot drift between transports.
        - `chat.read` — `{ quote_id, last_read_message_id }`.
        - `ping` — `{ at }`; the server answers with `heartbeat`.

        The client must reconnect with exponential backoff and re-fetch
        authoritative state on reconnect — the socket is a notification channel,
        not a source of truth. A frame lost during a reconnect window is
        recovered by re-listing the affected chat, not by replaying the socket.
      operationId: realtime
      tags:
      - Realtime
      security: []
      x-websocket: true
      parameters:
      - name: ticket
        in: query
        required: true
        description: Single-use ticket from POST /chats/ws-ticket
        schema:
          type: string
      responses:
        '101':
          description: Switching protocols — WebSocket upgraded
        '401':
          $ref: '#/components/responses/unauthorized'
        '426':
          description: Upgrade required
  /openapi.json:
    get:
      summary: The OpenAPI document (machine-readable)
      description: |-
        **Documentation route, not a business API.** It serves this very
        contract as `application/json`, unauthenticated, so codegen, Postman,
        and the `/docs` UI all read the same bytes that were reviewed.

        No version prefix to pin and no auth: the URL must stay stable for
        external tooling. Do not add fields here — this is the published
        contract, and any change to it is an API change.

        The human-readable UI is GET /docs, which renders this document.
      operationId: getOpenapiJson
      tags:
      - Docs
      security: []
      responses:
        '200':
          description: The OpenAPI 3.0.3 document
          content:
            application/json:
              schema:
                type: object
              examples:
                document:
                  value:
                    openapi: 3.0.3
                    info:
                      title: Deal&Drive API
                      version: 1.1.0
        '304':
          description: Not modified — honour `ETag` / `If-None-Match`
  /docs:
    get:
      summary: Interactive API reference (HTML)
      description: |-
        **Documentation route, not a business API.** Serves a Swagger UI page
        that loads GET /openapi.json, so the rendered reference and the
        machine-readable contract can never drift apart.

        Unauthenticated and read-only. Useful with a local `?url=` override so a
        reviewer can point the UI at a branch's spec before merging it.
      operationId: getApiDocs
      tags:
      - Docs
      security: []
      parameters:
      - name: url
        in: query
        required: false
        description: Load the spec from this URL instead of /openapi.json.
        schema:
          type: string
          format: uri
      responses:
        '200':
          description: HTML page rendering the API reference
          content:
            text/html:
              schema:
                type: string
  /payment:
    post:
      summary: Subscribe (simulated card checkout)
      description: |-
        Activates premium for one year for the calling buyer or dealer. If
        the caller already has an unexpired premium, the new year stacks
        onto the current `premium_expires_at`. Every success appends a row
        to the `payments` ledger recording the plan, amount, currency,
        detected brand and last four digits only.

        Checkout is simulated: any well-formed card details succeed and
        the full card number and CVV are never persisted. Staff sessions
        (support, support-admin, admin) receive 403 FORBIDDEN_ROLE;
        malformed card details receive 422.
      operationId: createPayment
      tags:
      - Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            examples:
              dealer_annual:
                value:
                  payment_method: credit_card
                  card_number: '4242424242424242'
                  cardholder_name: Naveen Kumar
                  expiry_month: 12
                  expiry_year: 2027
                  cvv: '123'
      responses:
        '200':
          description: Payment recorded, premium extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
              examples:
                first_purchase:
                  value:
                    payment_id: 6b5a4d3c-2e1f-4a0b-9d8c-7e6f5a4b3c2d
                    status: succeeded
                    plan: dealer_premium
                    amount: '500.00'
                    currency: USD
                    payment_method: credit_card
                    card_brand: visa
                    card_last4: '4242'
                    premium_expires_at: '2027-10-06T13:02:42Z'
                    subscription:
                      role: dealer
                      plan: premium
                      is_premium: true
                      premium_expires_at: '2027-10-06T13:02:42Z'
                      trial_started_at: '2026-10-06T13:02:42Z'
                      trial_expires_at: '2026-12-05T13:02:42Z'
                      premium_price: '500.00'
                      currency: USD
                      quote_limit: null
                      quotes_used: 31
                      quotes_remaining: null
                      can_quote: true
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_error'
components:
  parameters:
    ConfigType:
      name: config_type
      in: path
      required: true
      description: Versioned administrator configuration surface
      schema:
        type: string
        enum: [workflow, prompt, theme]
    ConfigKey:
      name: config_key
      in: path
      required: true
      description: Stable workflow, prompt, or theme key
      schema:
        type: string
        minLength: 1
        maxLength: 80
    AdminLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
        default: 100
    ProfileId:
      name: profile_id
      in: path
      required: true
      description: Profile UUID
      schema:
        type: string
        format: uuid
    RequestId:
      name: request_id
      in: path
      required: true
      description: Buyer request UUID
      schema:
        type: string
        format: uuid
    QuoteId:
      name: quote_id
      in: path
      required: true
      description: Quote UUID
      schema:
        type: string
        format: uuid
    DealId:
      name: quote_id
      in: path
      required: true
      description: Deal UUID
      schema:
        type: string
        format: uuid
    ChatQuoteId:
      name: quote_id
      in: path
      required: true
      description: |-
        The quote whose chat this is. Named explicitly rather than `id`
        because a chat has no id of its own — it is scoped to its quote.
      schema:
        type: string
        format: uuid
    ChatRequestId:
      name: quote_id
      in: path
      required: true
      description: Chat access request UUID
      schema:
        type: string
        format: uuid
    QuoteDocId:
      name: quote_id
      in: path
      required: true
      description: Quote that owns the documents
      schema:
        type: string
        format: uuid
    DocumentConfirmId:
      name: document_id
      in: path
      required: true
      description: Deal document UUID
      schema:
        type: string
        format: uuid
    CarId:
      name: car_id
      in: path
      required: true
      description: Car listing UUID
      schema:
        type: string
        format: uuid
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Deal document UUID
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticket_id
      in: path
      required: true
      description: Support ticket UUID
      schema:
        type: string
        format: uuid
    VerificationId:
      name: verification_id
      in: path
      required: true
      description: Verification UUID
      schema:
        type: string
        format: uuid
    ThreadId:
      name: thread_id
      in: path
      required: true
      description: AI thread UUID
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from the previous page
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeWithdrawn:
      name: include_withdrawn
      in: query
      description: |-
        Withdrawn quotes are hidden by default — the buyer should not see
        a dealer retreat from the leaderboard.
      schema:
        type: boolean
        default: false
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        RS256 access token from /auth/login or /auth/refresh.

        Subject = `profiles.id` (NOT the `users.id`, which is a different
        UUID and does not appear anywhere in the request layer). Roles are
        read from the `profiles` row on every request, so a role change or a
        suspension takes effect on the next call rather than at token expiry.

        For the WebSocket, use a one-shot ticket from /chats/ws-ticket
        instead — a browser cannot set this header on the handshake.
  responses:
    unauthorized:
      description: |-
        Missing, malformed, expired, or revoked token. `code`
        distinguishes: `UNAUTHORIZED`, `TOKEN_EXPIRED`, `TOKEN_REVOKED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expired:
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: Your session has expired. Sign in again.
                  details: null
                  request_id: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
    forbidden:
      description: |-
        Authenticated, but not allowed. `code` distinguishes:
        `FORBIDDEN_ROLE` (wrong role for this surface), `NOT_RESOURCE_OWNER`
        (someone else's resource), `INSUFFICIENT_ROLE` (a support agent trying
        to approve a peer agent).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            wrong_role:
              value:
                error:
                  code: FORBIDDEN_ROLE
                  message: The AI advisor is only available to buyers.
                  details: null
                  request_id: 7a6b5c4d-3e2f-4a1b-8c9d-0e1f2a3b4c5d
            agent_approving_agent:
              value:
                error:
                  code: INSUFFICIENT_ROLE
                  message: Only an admin can approve a support agent account.
                  details:
                    required_role: admin
                    your_role: support
                  request_id: 1b2c3d4e-5f60-4a1b-8c2d-3e4f5a6b7c8d
    subscription_required:
      description: |-
        The caller's plan does not allow this action (HTTP 402,
        `code = SUBSCRIPTION_REQUIRED`). `details.reason` distinguishes:
        `trial_quota_exhausted` (dealer used all 3 trial quotes),
        `trial_expired`, `premium_expired`, `request_limit_reached`
        (buyer at the 3-post free limit). `details` also carries `plan`,
        `used` and `limit`. Existing quotes, deals and requests stay
        visible after expiry — only creating new ones is blocked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            dealer_quota:
              value:
                error:
                  code: SUBSCRIPTION_REQUIRED
                  message: Your free trial includes 3 quotes. Subscribe to the premium plan to keep
                    quoting.
                  details:
                    reason: trial_quota_exhausted
                    plan: trial
                    used: 3
                    limit: 3
                  request_id: 8f7e6d5c-4b3a-4c2d-9e1f-0a1b2c3d4e5f
            buyer_limit:
              value:
                error:
                  code: SUBSCRIPTION_REQUIRED
                  message: Your free plan includes 3 car buy posts. Subscribe to the premium plan to
                    publish more.
                  details:
                    reason: request_limit_reached
                    plan: free
                    used: 3
                    limit: 3
                  request_id: 7e6d5c4b-3a2f-4b1d-8c0e-9f8a7b6c5d4e
    pending_review:
      description: |-
        The account exists but is inactive pending manual approval. This is
        the only case where the error body is meant to drive a *pending
        screen* rather than a form error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            dealer:
              value:
                error:
                  code: DEALER_PENDING_REVIEW
                  message: Your dealer account is awaiting support review — you'll get an email once it's
                    approved.
                  details:
                    role: dealer
                    status: pending
                  request_id: 9e8d7c6b-5a49-4e3d-8c2b-1a0f9e8d7c6b
            support:
              value:
                error:
                  code: SUPPORT_PENDING_REVIEW
                  message: Your support account is pending approval. Our team reviews every request —
                    you'll get an email once it's approved.
                  details:
                    role: support
                    status: pending
                  request_id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
    not_found:
      description: The resource does not exist, or the caller may not know it exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                error:
                  code: NOT_FOUND
                  message: That request could not be found.
                  details: null
                  request_id: 4d5e6f70-8a9b-4c1d-9e2f-3a4b5c6d7e8f
    conflict:
      description: |-
        The request is valid but the current state forbids it. `code`
        distinguishes: `CONFLICT` (generic, `details` lists the legal
        transitions), `ALREADY_EXISTS` (duplicate signup, second live quote
        on the same request), `INVALID_TRANSITION` (deal or quote status
        machine rejected the move), `TOKEN_ALREADY_USED` (refresh replay).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            illegal_deal_transition:
              value:
                error:
                  code: INVALID_TRANSITION
                  message: A matched deal cannot move straight to completed.
                  details:
                    current: matched
                    attempted: completed
                    allowed_transitions:
                    - negotiation
                    - cancelled
                  request_id: 5e6f7081-9a2b-4c3d-8e4f-5a6b7c8d9e0f
            duplicate_quote:
              value:
                error:
                  code: ALREADY_EXISTS
                  message: You already have a live quote on this request. Revise it instead.
                  details:
                    existing_quote_id: 724c2d61-b1be-47ba-9458-0f4001204a1b
                  request_id: 6f708192-0a3b-4d5e-9f6a-7b8c9d0e1f2a
    validation_error:
      description: |-
        Body, path or query failed validation. `details` is a
        field → message map so the client can highlight the offending input
        rather than showing a generic banner.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            field_errors:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Some fields need attention.
                  details:
                    email:
                    - That email is already registered.
                    budget_max:
                    - budget_max must be greater than or equal to budget_min.
                  request_id: 0718293a-4b5c-4d6e-8f70-9a1b2c3d4e5f
    invalid_token:
      description: Expired, already-used, or malformed one-shot token (reset link, WS ticket, chat id)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            expired_ticket:
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: That link has expired. Request a new one.
                  details: null
                  request_id: 18293a4b-5c6d-4e7f-8071-9a2b3c4d5e6f
    rate_limited:
      description: |-
        Rate limit hit. `details` carries `retry_after` (seconds) and the
        limit name, so the client can show a countdown instead of a dead
        error state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            ai_rate:
              value:
                error:
                  code: RATE_LIMITED
                  message: You're sending a lot of questions. Give it a moment.
                  details:
                    limit: ai:20/min
                    retry_after: 42
                  request_id: 293a4b5c-6d7e-4f80-8192-9a3b4c5d6e7f
  schemas:
    RgbColor:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: integer
        minimum: 0
        maximum: 255
      example: [20, 86, 184]
    ThemeDefinition:
      type: object
      required: [name, primary_rgb, background_rgb, surface_rgb, text_rgb, navigation_rgb]
      properties:
        name: { type: string, maxLength: 80 }
        primary_rgb: { $ref: '#/components/schemas/RgbColor' }
        background_rgb: { $ref: '#/components/schemas/RgbColor' }
        surface_rgb: { $ref: '#/components/schemas/RgbColor' }
        text_rgb: { $ref: '#/components/schemas/RgbColor' }
        navigation_rgb: { $ref: '#/components/schemas/RgbColor' }
    ActiveTheme:
      allOf:
      - $ref: '#/components/schemas/ThemeDefinition'
      - type: object
        required: [version]
        properties:
          version: { type: integer, minimum: 0 }
    WorkflowPosition:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    WorkflowNode:
      type: object
      required: [id, type, label, description, position]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type:
          type: string
          enum: [router, agent, tool, action]
        label: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        position: { $ref: '#/components/schemas/WorkflowPosition' }
    WorkflowEdge:
      type: object
      required: [id, source, target, condition]
      properties:
        id: { type: string, minLength: 1, maxLength: 120 }
        source: { type: string, minLength: 1, maxLength: 80 }
        target: { type: string, minLength: 1, maxLength: 80 }
        condition: { type: string, minLength: 1, maxLength: 80 }
    WorkflowDefinition:
      type: object
      required: [name, description, nodes, edges]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        nodes:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/WorkflowNode' }
        edges:
          type: array
          minItems: 1
          maxItems: 80
          items: { $ref: '#/components/schemas/WorkflowEdge' }
    PromptDefinition:
      type: object
      required: [content, model, reasoning_effort, max_output_tokens]
      properties:
        content:
          type: string
          minLength: 20
          maxLength: 50000
        model: { type: string, minLength: 2, maxLength: 80 }
        reasoning_effort:
          type: string
          enum: [minimal, low, medium, high, xhigh]
        max_output_tokens:
          type: integer
          minimum: 128
          maximum: 32000
    AdministrationCatalog:
      type: object
      required: [workflow_key, theme_key, nodes, prompts, models]
      properties:
        workflow_key: { type: string, example: sera-main }
        theme_key: { type: string, example: global }
        nodes:
          type: array
          items: { type: object, additionalProperties: true }
        prompts:
          type: array
          items: { type: object, additionalProperties: true }
        models:
          type: array
          items: { type: object, additionalProperties: true }
    ConfigurationRevision:
      type: object
      required: [id, config_type, config_key, version, status, payload, checksum]
      properties:
        id: { type: string }
        config_type:
          type: string
          enum: [workflow, prompt, theme]
        config_key: { type: string }
        version: { type: integer, minimum: 0 }
        status:
          type: string
          enum: [draft, published, archived]
        payload:
          type: object
          additionalProperties: true
        checksum: { type: string, minLength: 64, maxLength: 64 }
        published_at: { type: string, format: date-time, nullable: true }
        published_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        updated_by: { type: string }
    ConfigurationBundle:
      type: object
      required: [active, draft, history, default_version]
      properties:
        active: { $ref: '#/components/schemas/ConfigurationRevision' }
        draft:
          allOf: [{ $ref: '#/components/schemas/ConfigurationRevision' }]
          nullable: true
        history:
          type: array
          items: { $ref: '#/components/schemas/ConfigurationRevision' }
        default_version: { type: integer, minimum: 0 }
    PromptConfigurationBundle:
      allOf:
      - $ref: '#/components/schemas/ConfigurationBundle'
      - type: object
        required: [key, file, label, description]
        properties:
          key: { type: string }
          file: { type: string }
          label: { type: string }
          description: { type: string }
    ValidateConfigRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: object, additionalProperties: true }
    ConfigValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    DraftSaveRequest:
      type: object
      required: [payload]
      properties:
        payload: { type: object, additionalProperties: true }
        base_version: { type: integer, minimum: 0, nullable: true }
    PublishConfigRequest:
      type: object
      required: [revision_id]
      properties:
        revision_id: { type: string, format: uuid }
    SetDefaultRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0 }
    ConfigurationDefaultResult:
      type: object
      required: [config_type, config_key, default_version]
      properties:
        config_type:
          type: string
          enum: [workflow, prompt, theme]
        config_key: { type: string }
        default_version: { type: integer, minimum: 0 }
    AdministrationAuditEvent:
      type: object
      required: [id, uuid, action, resource_type, resource_key, actor_id, details, created_at]
      properties:
        id: { type: integer }
        uuid: { type: string, format: uuid }
        action: { type: string }
        resource_type: { type: string }
        resource_key: { type: string }
        revision_id: { type: string, nullable: true }
        actor_id: { type: string }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    AiTraceSpan:
      type: object
      required: [id, trace_id, sequence, name, kind, status, duration_ms, input_tokens, output_tokens, details, created_at]
      properties:
        id: { type: string, format: uuid }
        trace_id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        name: { type: string }
        kind: { type: string, example: llm }
        status: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        model_name: { type: string, nullable: true }
        details:
          type: object
          description: Redacted stage input/output, provider, prompt version, attempts, error, and next handoff when available.
          additionalProperties: true
        created_at: { type: string, format: date-time }
    AiTrace:
      type: object
      required: [id, query, status, is_test, input_tokens, output_tokens, duration_ms, configuration_version]
      properties:
        id: { type: string, format: uuid }
        thread_id: { type: string, nullable: true }
        user_id: { type: string, nullable: true }
        query: { type: string }
        status: { type: string }
        is_test: { type: boolean }
        route: { type: string, nullable: true }
        model_name: { type: string, nullable: true }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        error_message: { type: string, nullable: true }
        configuration_version: { type: string }
        created_at: { type: string, format: date-time }
    AiTraceDetail:
      allOf:
      - $ref: '#/components/schemas/AiTrace'
      - type: object
        required: [spans]
        properties:
          spans:
            type: array
            items: { $ref: '#/components/schemas/AiTraceSpan' }
    WorkflowPreviewRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 2000 }
        thread_id:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          nullable: true
          description: Omit to start a new isolated administrator test thread. Send a previous preview thread ID to continue with its saved test context.
        revision_id: { type: string, format: uuid, nullable: true }
        workflow_payload: { type: object, additionalProperties: true, nullable: true }
        prompt_key: { type: string, nullable: true }
        prompt_payload: { type: object, additionalProperties: true, nullable: true }
    WorkflowPreviewResult:
      type: object
      required: [trace_id, thread_id, answer, duration_ms, input_tokens, output_tokens, execution_flow]
      properties:
        trace_id: { type: string, format: uuid }
        thread_id: { type: string }
        route: { type: string, nullable: true }
        mode: { type: string, nullable: true }
        answer: { type: string }
        sources:
          type: array
          items: { type: object, additionalProperties: true }
        steps: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        model_name: { type: string, nullable: true }
        execution_flow:
          type: array
          items: { $ref: '#/components/schemas/AiTraceSpan' }
    DecimalString:
      type: string
      description: |-
        A decimal serialised as a string, e.g. "70229.00". **Never a JSON
        number** — JavaScript would turn 0.1 + 0.2 into 0.30000000000000004
        and an OTD estimate would be off by cents.

        Other observed values: `47500.00`, `0.065`.
      pattern: ^-?\d+(\.\d{1,2})?$
      example: '70229.00'
    ErrorResponse:
      type: object
      description: |-
        The only non-2xx JSON shape. There is no `success: false` wrapper —
        the presence of `error` is the signal.
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: |-
                Stable machine-readable code. Branch on this, never on
                `message`.

                All codes: UNAUTHORIZED, TOKEN_EXPIRED, FORBIDDEN_ROLE, NOT_RESOURCE_OWNER, INSUFFICIENT_ROLE, DEALER_PENDING_REVIEW, SUPPORT_PENDING_REVIEW, NOT_FOUND, CONFLICT, ALREADY_EXISTS, INVALID_TRANSITION, VALIDATION_ERROR, SUBSCRIPTION_REQUIRED, RATE_LIMITED, INTERNAL_ERROR.
              example: UNAUTHORIZED
            message:
              type: string
              description: Human-readable. May be reworded at any time — do not parse.
              example: The AI advisor is only available to buyers.
            details:
              description: |-
                Structured context for this code — a field→message map for
                VALIDATION_ERROR, legal transitions for INVALID_TRANSITION,
                allowed_transitions for CONFLICT, retry_after for
                RATE_LIMITED. Null when there is nothing useful to add.
              type: object
              additionalProperties: true
              nullable: true
            request_id:
              type: string
              description: Correlates with the server log line and the `X-Request-ID` response header.
              example: 3f2a1b0c-9d8e-4f7a-8b6c-5d4e3f2a1b0c
    Health:
      type: object
      required:
      - status
      - database
      - version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - not_ready
        database:
          type: string
          enum:
          - ok
          - unreachable
        version:
          type: string
        reason:
          type: string
          description: Present only when status is not_ready
          nullable: true
    Role:
      type: string
      enum:
      - buyer
      - dealer
      - support
      - support-admin
      - admin
      description: |-
        Read from the `profiles` row on every request. Inventory ownership is
        recorded in the standard audit actor (`cars.created_by`).
    BodyType:
      type: string
      description: |-
        Taxonomy-driven and expected to grow, so this is not a hard CHECK
        constraint in the database. Clients must tolerate an unknown value
        and render it rather than crash.

        Observed values: SUV, Sedan, Hatchback, Sports Car, Coupe, MUV, Luxury, Truck, Van, Wagon, Convertible, Supercar, Crossover.
      example: SUV
    CarCondition:
      type: string
      enum:
      - New
      - Used
      - Certified
    Transmission:
      type: string
      enum:
      - Automatic
      - Manual
      - CVT
      - Dual Clutch
      - Other
    Drivetrain:
      type: string
      enum:
      - FWD
      - RWD
      - AWD
      - 4WD
      - Other
    FuelType:
      type: string
      enum:
      - Petrol
      - Diesel
      - Hybrid
      - Electric
      - CNG
      - LPG
      - Other
    RequestStatus:
      type: string
      enum:
      - draft
      - open
      - matched
      - closed
      description: |-
        `draft` is written by the AI intake path only. **Only**
        POST /requests/{id}/publish can move a request to `open`; no LangGraph
        node can reach `open`.
    QuoteStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      - withdrawn
      - expired
    DealStatus:
      type: string
      enum:
      - matched
      - negotiation
      - payment_pending
      - payment_confirmed
      - documents_pending
      - completed
      - cancelled
      description: |-
        Server-validated state machine. An illegal jump returns 409
        INVALID_TRANSITION with `details.allowed_transitions` so the client
        renders exactly the buttons the server will accept.
    CarStatus:
      type: string
      enum:
      - draft
      - active
      - sold
      - removed
      description: Only `active` listings may be quoted and cited as an AI source.
    TicketStatus:
      type: string
      enum:
      - new
      - in-progress
      - on-hold
      - resolved
      - closed
    TicketPriority:
      type: string
      enum:
      - low
      - medium
      - high
      - urgent
    VerificationStatus:
      type: string
      enum:
      - pending
      - approved
      - denied
      - rejected
    PreferenceSource:
      type: string
      enum:
      - manual
      - ai_inferred
      - imported
    BuyerSignupRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - password
      - terms_accepted
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Adithyaa Anand
        email:
          type: string
          format: email
          maxLength: 320
          example: adithyaa.ma@gmail.com
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
          example: '+14695550142'
        password:
          type: string
          format: password
          minLength: 6
          description: |-
            Hashed with Argon2id, never logged, never returned.

            ⚠️ The product copy says **6 characters minimum** because that
            was explicitly specified, but the reset-password route enforces
            8. This is a known inconsistency, not an oversight: 6 characters
            is not a safe floor. It is recorded rather than silently changed
            because changing the product copy was not authorised.
        terms_accepted:
          type: boolean
          description: |-
            Must be literally `true`; a false value is a 422
            `VALIDATION_ERROR` and no account row is created.

            The signup form's Terms checkbox maps directly to this field — it is
            the only client-supplied half of the consent record.
          example: true
        terms_version:
          type: string
          description: |-
            Advisory only. The server overwrites this with its own
            `TERMS_VERSION` constant — a client must not be able to claim
            acceptance of a different version than the one it was shown.
          example: '2026-09-01'
        terms_accepted_at:
          type: string
          format: date-time
          description: |-
            Server timestamp of acceptance. If the client sends a value it is
            ignored and overwritten — the server's clock is the record.

            `NULL` on a pre-existing account means consent is absent, not
            unknown, and that account must re-accept. It is never backfilled
            with the migration timestamp, which would fabricate consent.
    DealerSignupRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - password
      - dealership_name
      - branch_name
      - dealer_license
      - state_id
      - address
      - terms_accepted
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
        password:
          type: string
          format: password
          minLength: 6
          description: Argon2id. Same 6-vs-8 character caveat as buyer signup.
        dealership_name:
          type: string
          minLength: 1
          maxLength: 150
          example: Navee Motors
        branch_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Frisco
        dealer_license:
          type: string
          minLength: 1
          maxLength: 60
          description: Dealership licence number, verified by support against the state registry.
          example: US030202
        state_id:
          type: string
          format: uuid
          description: Branch state. Drives the dealer feed's default geo centre.
        address:
          type: string
          minLength: 1
          maxLength: 300
          example: 4100 Legacy Dr, Frisco, TX
        website:
          type: string
          format: uri
          maxLength: 300
          nullable: true
        brand_ids:
          type: array
          description: Brands this branch carries. Feeds the feed's brand filter; no FK on the array elements
            (Postgres cannot), so orphans are possible and ignored.
          items:
            type: string
            format: uuid
        terms_accepted:
          type: boolean
          enum:
          - true
          description: Must be literally `true` — the Terms checkbox is not optional. A 422 `VALIDATION_ERROR`
            is returned and no row is created otherwise.
        terms_version:
          type: string
          description: Advisory only; overwritten by the server's `TERMS_VERSION`.
        terms_accepted_at:
          type: string
          format: date-time
          description: Server timestamp; a client-supplied value is ignored. Written at the same moment
            as the `users` row, so an account never exists without its consent record.
    SupportSignupRequest:
      type: object
      required:
      - full_name
      - email
      - phone
      - password
      - address
      - state_id
      - terms_accepted
      description: |-
        Support team accounts require manual approval.

        Field names here are the exact signup form fields: Full Name, Phone
        Number, Location Address (split into `address` + `state_id`), optional
        Extra information, Email address, and password.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
          example: Support03
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
          example: '+14695550144'
        address:
          type: string
          minLength: 1
          maxLength: 300
          description: Location Address — street, city, postal code
          example: 2200 Ross Ave, Dallas, TX
        state_id:
          type: string
          format: uuid
          description: Location Address — state, from GET /reference/states
        extra_info:
          type: string
          maxLength: 2000
          description: Extra information (optional) — free text for the reviewing agent
          example: Former dealership service manager, 6 years.
          nullable: true
        email:
          type: string
          format: email
          maxLength: 320
          example: support03@gmail.com
        password:
          type: string
          format: password
          minLength: 6
          description: Argon2id. Same 6-vs-8 character caveat as buyer signup.
        terms_accepted:
          type: boolean
          enum:
          - true
          description: |-
            Must be literally `true` — the Terms checkbox is not optional for agents
            any more than it is for buyers or dealers. A 422 `VALIDATION_ERROR` is
            returned and no row is created.
          example: true
        terms_version:
          type: string
          description: |-
            Advisory only; overwritten by the server's `TERMS_VERSION`. A support agent
            handles other people's data, so the consent record is worth storing even
            though the account starts inactive pending approval.
          example: '2026-09-01'
        terms_accepted_at:
          type: string
          format: date-time
          description: |-
            Server timestamp; a client-supplied value is ignored. Written at the same
            moment as the `users` row, so no account ever exists without its consent
            record.
          example: '2026-09-01T14:22:07Z'
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenPair:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Single-use. Presenting it again revokes the whole family.
        token_type:
          type: string
          enum:
          - bearer
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 1800
    AuthSession:
      allOf:
      - $ref: '#/components/schemas/TokenPair'
      - type: object
        required:
        - profile
        properties:
          profile:
            $ref: '#/components/schemas/Profile'
    PendingApproval:
      type: object
      description: |-
        Returned by dealer and support signup instead of tokens. The account
        row exists and is inactive; nothing about the session is usable yet.
      required:
      - pending
      - role
      - email
      - verification_id
      - ticket_id
      - message
      properties:
        pending:
          type: boolean
          enum:
          - true
        role:
          type: string
          enum:
          - dealer
          - support
        email:
          type: string
          format: email
        verification_id:
          type: string
          format: uuid
          description: The `support_verifications` row an agent will act on.
        ticket_id:
          type: string
          description: Human reference — `DV<epoch>` for dealers, `SA<epoch>` for agents.
          example: DV1788793917
        message:
          type: string
          description: |-
            The exact copy the pending screen shows. Dealers and agents get
            different sentences, not one templated string.
    SubscriptionState:
      type: object
      description: |-
        Derived subscription state for buyers and dealers — recomputed on
        every read from the profile's trial/premium timestamps plus usage
        counts, never stored as a plan flag. Omitted entirely for staff
        roles (support, support-admin, admin), which are not subject to
        marketplace limits. Precedence: active premium > active dealer
        trial > free tier.
      required:
      - role
      - plan
      - is_premium
      - premium_price
      - currency
      properties:
        role:
          $ref: '#/components/schemas/Role'
        plan:
          type: string
          enum:
          - premium
          - trial
          - free
        is_premium:
          type: boolean
        premium_expires_at:
          type: string
          format: date-time
          nullable: true
        trial_started_at:
          type: string
          format: date-time
          nullable: true
          description: Dealers only. Stamped server-side on first login; null for buyers and staff.
        trial_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Dealers only. 60 days from trial_started_at; evaluated on read.
        premium_price:
          type: string
          description: Display price of the caller's plan tier.
          example: '500.00'
        currency:
          type: string
          example: USD
        quote_limit:
          type: integer
          nullable: true
          description: Dealers only. null while premium (unlimited), 3 on trial, 0 when expired.
        quotes_used:
          type: integer
          description: Dealers only. Counted across all quote statuses.
        quotes_remaining:
          type: integer
          nullable: true
          description: Dealers only. null while premium.
        can_quote:
          type: boolean
          description: Dealers only. False triggers 402 SUBSCRIPTION_REQUIRED on POST /quotes.
        request_limit:
          type: integer
          nullable: true
          description: Buyers only. null while premium, otherwise 3 lifetime posts.
        requests_used:
          type: integer
          description: Buyers only.
        requests_remaining:
          type: integer
          nullable: true
          description: Buyers only. null while premium.
        can_create_request:
          type: boolean
          description: Buyers only. False triggers 402 SUBSCRIPTION_REQUIRED on POST /requests.
        ai_posting_allowed:
          type: boolean
          description: Buyers only. Mirrors can_create_request for the Serra preview gate.
    PaymentCreate:
      type: object
      description: |-
        Simulated card checkout. Details are validated for shape only —
        any well-formed card succeeds and activates (or extends) premium
        for one year. The full card number and CVV are never persisted;
        only the detected brand and last four digits reach the
        `payments` ledger.
      additionalProperties: false
      required:
      - payment_method
      - card_number
      - cardholder_name
      - expiry_month
      - expiry_year
      - cvv
      properties:
        payment_method:
          type: string
          enum:
          - credit_card
          - debit_card
        card_number:
          type: string
          minLength: 12
          maxLength: 25
          description: Any digit string of at least 12 digits. Never stored.
          example: '4242424242424242'
        cardholder_name:
          type: string
          minLength: 2
          maxLength: 120
          example: Demo Buyer
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
          example: 12
        expiry_year:
          type: integer
          minimum: 2020
          maximum: 2100
          example: 2027
        cvv:
          type: string
          minLength: 3
          maxLength: 4
          description: Numeric security code. Never stored.
          example: '123'
    PaymentResult:
      type: object
      description: Receipt for a simulated payment plus the refreshed subscription block.
      required:
      - payment_id
      - status
      - plan
      - amount
      - currency
      - payment_method
      - premium_expires_at
      - subscription
      properties:
        payment_id:
          type: string
          format: uuid
        status:
          type: string
          description: Checkout is simulated, so a 200 response is always succeeded.
          enum:
          - succeeded
        plan:
          type: string
          enum:
          - dealer_premium
          - buyer_premium
        amount:
          type: string
          example: '500.00'
        currency:
          type: string
          example: USD
        payment_method:
          type: string
          enum:
          - credit_card
          - debit_card
        card_brand:
          type: string
          nullable: true
          example: visa
        card_last4:
          type: string
          maxLength: 4
          nullable: true
          example: '4242'
        premium_expires_at:
          type: string
          format: date-time
        subscription:
          $ref: '#/components/schemas/SubscriptionState'
    Profile:
      type: object
      required:
      - id
      - role
      - full_name
      - email
      - created_at
      description: |-
        A `profiles` row joined with its `users` row. `id` is the **profile**
        UUID and is the JWT subject — the separate `users.id` is never
        serialised.
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        is_active:
          type: boolean
          description: False for a dealer or agent awaiting approval.
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When this account accepted the current Terms of Service, stamped by the
            server at signup. `null` on a row backfilled from the legacy schema means
            the account is **not** consented and must re-accept at next login — it is
            never backfilled with the migration timestamp, which would fabricate
            consent. Written at signup, so it cannot be null for any account created
            through a signup route. Read-only.
          example: '2026-09-01T14:22:07Z'
    MeResponse:
      allOf:
      - $ref: '#/components/schemas/Profile'
      - type: object
        description: |-
          The client routes on `role` — there is no role picker anywhere in
          the UI, and a dealer pending approval renders a pending state
          rather than a nav.
        properties:
          preferences:
            description: Present for buyers with a stored preference row, else null.
            allOf:
            - $ref: '#/components/schemas/BuyerPreference'
            nullable: true
          subscription:
            description: |-
              Derived plan/limits for buyers and dealers; omitted for staff
              roles. Present on both /auth/me and /profiles/me.
            allOf:
            - $ref: '#/components/schemas/SubscriptionState'
            nullable: true
    PublicProfile:
      type: object
      description: |-
        Another user's profile. Email, phone, verification notes and audit
        columns are stripped — a buyer can judge a dealer but cannot harvest
        their contact details before accepting a quote.
      required:
      - id
      - role
      - full_name
      - avatar_url
      - member_since
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        full_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        dealership_name:
          type: string
          description: Dealers only — the buyer's quote leaderboard shows it.
          nullable: true
        branch_name:
          type: string
          nullable: true
        seller_rating:
          type: number
          minimum: 0
          maximum: 5
          description: Dealers only. Tie-breaker on the leaderboard.
          example: 4.6
          nullable: true
        member_since:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      description: |-
        All keys optional (PATCH). Omitted keys are unchanged; an explicit
        `null` clears a nullable field.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
          nullable: true
        avatar_url:
          type: string
          format: uri
          nullable: true
        dealership_name:
          type: string
          maxLength: 150
          description: Dealers only.
          nullable: true
        branch_name:
          type: string
          maxLength: 120
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
    BuyerPreference:
      type: object
      description: |-
        One row per buyer, keyed on `profile_id` (PK *and* FK — strictly 1:1).
        Absence of a row means "no filtering at all", which is the intended
        default, so GET returns 404 rather than an empty object.

        Every nullable column here is a **wildcard** in matching: `NULL
        body_type` does not mean "no body type wanted", it means "any". A
        partial statement like "I like Ford" therefore still matches the
        whole catalogue.
      required:
      - profile_id
      - source
      - created_at
      - updated_at
      properties:
        profile_id:
          type: string
          format: uuid
        brand_id:
          type: string
          format: uuid
          description: Primary marque. Joined directly, so it is FK-constrained with ON DELETE SET NULL.
          nullable: true
        other_brand_ids:
          type: array
          description: |-
            Additional marques. **No foreign key** — Postgres cannot
            validate array elements, so a deleted brand leaves an orphan UUID
            behind. Harmless: an orphan is ignored rather than matching
            wrongly.
          items:
            type: string
            format: uuid
          nullable: true
        model_preference:
          type: string
          example: Bronco
          nullable: true
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seater_count:
          type: integer
          minimum: 2
          maximum: 15
          description: Matched with `cars.seating_capacity >= seater_count`, so 7 means "7 or more".
          example: 7
          nullable: true
        transmission:
          allOf:
          - $ref: '#/components/schemas/Transmission'
          nullable: true
        drivetrain:
          allOf:
          - $ref: '#/components/schemas/Drivetrain'
          nullable: true
        fuel_type:
          allOf:
          - $ref: '#/components/schemas/FuelType'
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        exterior_color:
          type: string
          description: Matches `cars.color_name` — the human name, not the hex `cars.color`.
          nullable: true
        min_year:
          type: integer
          minimum: 1990
          maximum: 2035
          nullable: true
        max_mileage:
          type: integer
          minimum: 0
          nullable: true
        budget_min:
          type: integer
          minimum: 0
          description: Integer dollars, unlike the string money fields on requests and quotes.
          nullable: true
        budget_max:
          type: integer
          minimum: 0
          description: CHECK (budget_max >= budget_min)
          nullable: true
        must_have_features:
          type: array
          items:
            type: string
          example:
          - sunroof
          - leather
          - apple_carplay
          nullable: true
        never_want_features:
          type: array
          description: |-
            Hard exclusions, applied as `NOT ILIKE ANY` against the car's
            title. A match is always fatal, never a score penalty.
          items:
            type: string
          example:
          - manual_transmission
          nullable: true
        source:
          $ref: '#/components/schemas/PreferenceSource'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Set only when `source = 'ai_inferred'`.
          example: 0.92
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BuyerPreferenceUpsert:
      type: object
      description: |-
        Full replacement, **not** a merge. Every omitted nullable column
        becomes NULL, and a NULL is a wildcard — so a partial update here
        would silently *widen* the buyer's filters instead of narrowing them.
        Always send the whole object.

        `source`, `confidence`, `profile_id` and audit columns are not
        accepted; sending `ai_inferred` from a client is 422.
      properties:
        brand_id:
          type: string
          format: uuid
          nullable: true
        other_brand_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        model_preference:
          type: string
          nullable: true
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seater_count:
          type: integer
          minimum: 2
          maximum: 15
          nullable: true
        transmission:
          allOf:
          - $ref: '#/components/schemas/Transmission'
          nullable: true
        drivetrain:
          allOf:
          - $ref: '#/components/schemas/Drivetrain'
          nullable: true
        fuel_type:
          allOf:
          - $ref: '#/components/schemas/FuelType'
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        exterior_color:
          type: string
          nullable: true
        min_year:
          type: integer
          minimum: 1990
          maximum: 2035
          nullable: true
        max_mileage:
          type: integer
          minimum: 0
          nullable: true
        budget_min:
          type: integer
          minimum: 0
          nullable: true
        budget_max:
          type: integer
          minimum: 0
          nullable: true
        must_have_features:
          type: array
          items:
            type: string
          nullable: true
        never_want_features:
          type: array
          items:
            type: string
          nullable: true
    StateRef:
      type: object
      required:
      - id
      - name
      - code
      - tax_rate
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Texas
        code:
          type: string
          minLength: 2
          maxLength: 2
          example: TX
        tax_rate:
          $ref: '#/components/schemas/DecimalString'
          description: Combined state + local rate, decimal fraction as a string.
    BrandRef:
      type: object
      required:
      - id
      - name
      - country_code
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Ford
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          example: DE
    RequestUpsert:
      type: object
      description: |-
        Create or PATCH a request. `status`, `quote_count`,
        `sales_tax_rate` and every audit column are server-owned; sending
        them is 422. The buyer's stored `buyer_preference` is snapshotted onto
        the row at create time, so later preference edits do not silently
        change what dealers were asked.
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: 7-seater SUV under 65k
        description:
          type: string
          maxLength: 5000
          nullable: true
        state_id:
          type: string
          format: uuid
          description: Where the car is wanted. Drives the dealer feed's geo filter.
          nullable: true
        brand_id:
          type: string
          format: uuid
          nullable: true
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seater_count:
          type: integer
          minimum: 2
          maximum: 15
          nullable: true
        min_year:
          type: integer
          minimum: 1990
          maximum: 2035
          nullable: true
        max_mileage:
          type: integer
          minimum: 0
          nullable: true
        budget_min:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        budget_max:
          description: CHECK (budget_max >= budget_min)
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        target_otd:
          description: |-
            Out-the-door ceiling the buyer will actually pay. The compare
            agent analyses every quote against this, and against
            `budget_max` separately.
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        transmission:
          allOf:
          - $ref: '#/components/schemas/Transmission'
          nullable: true
        drivetrain:
          allOf:
          - $ref: '#/components/schemas/Drivetrain'
          nullable: true
        fuel_type:
          allOf:
          - $ref: '#/components/schemas/FuelType'
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        exterior_color:
          type: string
          nullable: true
        must_haves:
          type: array
          description: |-
            Free tags, not FK-constrained — opaque strings are exactly the
            case where element-level integrity buys nothing.
          items:
            type: string
          example:
          - sunroof
          - leather
          - apple_carplay
        nice_to_haves:
          type: array
          items:
            type: string
          example:
          - third_row
          - heated_seats
    BuyerRequest:
      type: object
      required:
      - id
      - buyer_id
      - status
      - title
      - created_at
      - updated_at
      - quote_count
      - view_count
      properties:
        id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
          description: The owning buyer's profile UUID.
        status:
          $ref: '#/components/schemas/RequestStatus'
        title:
          type: string
        description:
          type: string
          nullable: true
        state_id:
          type: string
          format: uuid
          nullable: true
        state_name:
          type: string
          example: Texas
          nullable: true
        brand_id:
          type: string
          format: uuid
          nullable: true
        brand_name:
          type: string
          example: Ford
          nullable: true
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seater_count:
          type: integer
          nullable: true
        min_year:
          type: integer
          nullable: true
        max_mileage:
          type: integer
          nullable: true
        budget_min:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        budget_max:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        target_otd:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        transmission:
          allOf:
          - $ref: '#/components/schemas/Transmission'
          nullable: true
        drivetrain:
          allOf:
          - $ref: '#/components/schemas/Drivetrain'
          nullable: true
        fuel_type:
          allOf:
          - $ref: '#/components/schemas/FuelType'
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        exterior_color:
          type: string
          nullable: true
        must_haves:
          type: array
          items:
            type: string
        nice_to_haves:
          type: array
          items:
            type: string
        quote_count:
          type: integer
          minimum: 0
          description: Dealer quotes for this request, excluding withdrawn quotes.
        view_count:
          type: integer
          minimum: 0
          description: Unique verified dealers that opened the request. Repeat visits by one dealer count once.
        sales_tax_rate:
          type: string
          description: |-
            The request's state's combined rate, snapshotted. This is what
            makes `deal_quotes.final_price` reproducible later.
          nullable: true
          example: '0.0725'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BuyerRequestDetail:
      allOf:
      - $ref: '#/components/schemas/BuyerRequest'
      - type: object
        properties:
          quotes:
            type: array
            description: The leaderboard, best-first. Same order as GET /requests/{id}/quotes.
            items:
              $ref: '#/components/schemas/QuoteSummary'
          preference_snapshot:
            description: |-
              The preference as it was when the request was created, not
              the buyer's current preference. A dealer is being paid to
              answer the question that was actually asked.
            allOf:
            - $ref: '#/components/schemas/BuyerPreference'
            nullable: true
    RequestList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuyerRequest'
        next_cursor:
          type: string
          nullable: true
    FeedRequest:
      type: object
      description: |-
        A request as a dealer sees it. Same `buyer_requests` row, trimmed
        view: no contact details, no other dealers' quotes, no internal
        preference reasoning. The `match_score` is the dealer's own ranking
        signal — 0–100, from how many preference columns the listing row
        satisfies, with a `never_want` hit forced to 0 rather than penalised.
      required:
      - id
      - status
      - title
      - created_at
      - match_score
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RequestStatus'
        title:
          type: string
        description:
          type: string
          nullable: true
        state_id:
          type: string
          format: uuid
          nullable: true
        state_name:
          type: string
          nullable: true
        distance_miles:
          type: number
          description: From the dealer's registered address; null when the request has no state.
          example: 12.4
          nullable: true
        brand_name:
          type: string
          nullable: true
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seater_count:
          type: integer
          nullable: true
        min_year:
          type: integer
          nullable: true
        max_mileage:
          type: integer
          nullable: true
        budget_max:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        target_otd:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        transmission:
          allOf:
          - $ref: '#/components/schemas/Transmission'
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        must_haves:
          type: array
          items:
            type: string
        nice_to_haves:
          type: array
          items:
            type: string
        quote_count:
          type: integer
          minimum: 0
          description: Competitor quote count — social proof, and it changes over time.
        my_quote_id:
          type: string
          format: uuid
          description: Set when this dealer has already quoted, so the UI can offer Revise instead of
            Quote.
          nullable: true
        match_score:
          type: number
          minimum: 0
          maximum: 100
          description: |-
            How well the dealer's inventory satisfies this request.
            0 when any `never_want` tag matches — an exclusion is a
            disqualification, not a deduction.
        created_at:
          type: string
          format: date-time
    FeedRequestList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedRequest'
        next_cursor:
          type: string
          nullable: true
    ComparableRequest:
      type: object
      required:
      - id
      - title
      - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/RequestStatus'
        quote_count:
          type: integer
        best_offer:
          description: Lowest effective_price on the request, or null if nobody has quoted.
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
    QuoteCreateRequest:
      type: object
      required:
      - request_id
      - price
      - estimated_delivery_days
      - message
      properties:
        request_id:
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/DecimalString'
          description: Pre-tax, pre-discount.
        discount:
          description: Line-item concessions. CHECK (discount >= 0)
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        estimated_delivery_days:
          type: integer
          minimum: 0
          maximum: 365
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: The dealer's pitch. Shown on the leaderboard card.
        car_ids:
          type: array
          description: |-
            This dealer's own `active` listings backing the quote. A dealer
            may only attach their own cars — attaching someone else's is 403,
            not a filter that quietly drops them.
          items:
            type: string
            format: uuid
        valid_until:
          type: string
          format: date-time
          description: Offer expiry. The quote becomes `expired` server-side, not by a client timer.
          nullable: true
    QuoteReviseRequest:
      type: object
      required:
      - price
      - estimated_delivery_days
      properties:
        price:
          $ref: '#/components/schemas/DecimalString'
        discount:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        estimated_delivery_days:
          type: integer
          minimum: 0
          maximum: 365
        message:
          type: string
          maxLength: 2000
          nullable: true
        valid_until:
          type: string
          format: date-time
          nullable: true
    QuoteSummary:
      type: object
      description: |-
        The leaderboard row — enough to rank and choose, not the full quote.
        `is_leading` is computed server-side so two open tabs agree on which
        quote is at the top instead of each computing its own sort.
      required:
      - id
      - request_id
      - status
      - price
      - effective_price
      - created_at
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/QuoteStatus'
        price:
          $ref: '#/components/schemas/DecimalString'
        discount:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          nullable: true
        final_price:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          description: |-
            **Generated column**, `(price - discount) * (1 + sales_tax_rate)`.
            Computed in the database, never accepted from a client.
        effective_price:
          allOf:
          - $ref: '#/components/schemas/DecimalString'
          description: |-
            What the comparison actually ranks on: `final_price` plus
            shipping and any dealer fees, rounded half-up to cents. Sent
            separately so the client never re-derives money arithmetic.
        estimated_delivery_days:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
        dealer:
          $ref: '#/components/schemas/PublicProfile'
        is_leading:
          type: boolean
        revision_count:
          type: integer
          minimum: 0
        valid_until:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    QuoteDetail:
      allOf:
      - $ref: '#/components/schemas/QuoteSummary'
      - type: object
        properties:
          buyer_id:
            type: string
            format: uuid
          cars:
            type: array
            items:
              $ref: '#/components/schemas/Car'
          revisions:
            type: array
            description: |-
              Every prior version, newest last. Appended on revise — a
              dealer cannot erase a number they already showed a buyer.
            items:
              type: object
              properties:
                price:
                  $ref: '#/components/schemas/DecimalString'
                discount:
                  allOf:
                  - $ref: '#/components/schemas/DecimalString'
                  nullable: true
                final_price:
                  $ref: '#/components/schemas/DecimalString'
                message:
                  type: string
                  nullable: true
                created_at:
                  type: string
                  format: date-time
          negotiation_requested:
            type: boolean
            description: The buyer asked to reopen this declined quote. Does not change `status` — the
              dealer still decides.
          buyer_chat_cleared_at:
            type: string
            format: date-time
            description: Buyer cleared their side. A tie-breaker on the leaderboard, never shown as a
              message.
            nullable: true
          dealer_chat_cleared_at:
            type: string
            format: date-time
            nullable: true
          deal_id:
            type: string
            format: uuid
            description: Set once accepted.
            nullable: true
    QuoteList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteSummary'
        next_cursor:
          type: string
          nullable: true
    QuoteAcceptResult:
      type: object
      description: |-
        The atomic accept. Losing quotes are withdrawn and the request moves
        to `matched` in the same transaction, so two buyers can never accept
        two quotes on one request. Idempotent on retry — a flaky network
        returns the same `deal_id` rather than a 409.
      required:
      - quote_id
      - deal_id
      - request_status
      - effective_price
      - withdrawn_quote_count
      properties:
        quote_id:
          type: string
          format: uuid
        deal_id:
          type: string
          format: uuid
        request_status:
          type: string
          enum:
          - matched
        effective_price:
          $ref: '#/components/schemas/DecimalString'
        withdrawn_quote_count:
          type: integer
          minimum: 0
          description: Losing quotes withdrawn in the same transaction. Their dealers get a WS `quote_update`.
        deal:
          $ref: '#/components/schemas/DealDetail'
    DealDetail:
      type: object
      required:
      - id
      - quote_id
      - request_id
      - buyer_id
      - dealer_id
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        dealer_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/DealStatus'
        status_history:
          type: array
          description: |-
            Append-only, from `deal_quotes.deal_history`. Every entry records
            who moved it and from where — the audit trail for a money
            dispute.
          items:
            $ref: '#/components/schemas/DealStatusEvent'
        request:
          $ref: '#/components/schemas/BuyerRequest'
        quote:
          $ref: '#/components/schemas/QuoteSummary'
        buyer:
          $ref: '#/components/schemas/PublicProfile'
        dealer:
          $ref: '#/components/schemas/PublicProfile'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DealDocument'
        checklist:
          $ref: '#/components/schemas/DealDocumentChecklist'
        unread_message_count:
          type: integer
          minimum: 0
          description: Messages since this user's `*_chat_cleared_at` stamp. Drives the nav badge.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DealList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DealDetail'
        next_cursor:
          type: string
          nullable: true
    DealStatusEvent:
      type: object
      required:
      - status
      - changed_at
      - changed_by
      properties:
        status:
          $ref: '#/components/schemas/DealStatus'
        previous_status:
          allOf:
          - $ref: '#/components/schemas/DealStatus'
          nullable: true
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 1000
          nullable: true
    ChatMessage:
      type: object
      required:
      - id
      - quote_id
      - sender_id
      - sender_role
      - message
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated for optimistic rendering; the server persists and echoes it back.
        quote_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        sender_role:
          type: string
          enum:
          - buyer
          - dealer
        message:
          type: string
          minLength: 1
          maxLength: 5000
        created_at:
          type: string
          format: date-time
    NegotiationRequest:
      type: object
      required:
      - quote_id
      - requested_at
      properties:
        quote_id:
          type: string
          format: uuid
        message:
          type: string
        requested_at:
          type: string
          format: date-time
        dealer_notified:
          type: boolean
    ChatClearResult:
      type: object
      required:
      - quote_id
      - cleared_side
      properties:
        quote_id:
          type: string
          format: uuid
        cleared_side:
          type: string
          enum:
          - buyer
          - dealer
          description: Only this side is cleared. No row is ever deleted.
        cleared_at:
          type: string
          format: date-time
        remaining_visible_to_you:
          type: integer
          minimum: 0
    DealerContact:
      type: object
      description: |-
        What the buyer is allowed to see about the dealer. Deliberately a
        dedicated shape rather than a `ProfileSummary`: the marketplace withholds
        these fields from a stranger and releases them on a commitment, so they
        must not be reachable by accident through a profile endpoint.
      required:
      - quote_id
      - contact_available
      - unlocked_by
      - dealer_profile_id
      - display_name
      - is_verified_dealer
      properties:
        quote_id:
          type: string
          format: uuid
        contact_available:
          type: boolean
          description: Drives the chat icon. Always true in a 200 — the gate is what produces 403.
        unlocked_by:
          type: string
          enum:
          - accepted_quote
          - accepted_chat_request
          description: Which commitment released the contact, so the UI can explain itself.
        dealer_profile_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Public name for the dealer side of the chat. May be the business name.
        avatar_url:
          type: string
          format: uri
          nullable: true
        business_name:
          type: string
        phone:
          type: string
          pattern: ^\+?[1-9]\d{6,14}$
        email:
          type: string
          format: email
        is_verified_dealer:
          type: boolean
        average_response_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: Dealer's rolling median first-response time; null until enough samples.
        chat_url:
          type: string
          description: |-
            Convenience pointer to the shared WebSocket. The client still POSTs
            /chats/ws-ticket first — the socket is authenticated by ticket, so
            this is documentation, not a ready-to-use URL.
    ChatAccessRequestStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
      description: |-
        `pending` is the only state in which the chat is closed. `accepted`
        opens it; `declined` is terminal for that request but the buyer may
        submit a new one against the same quote.
    ChatAccessRequestCreate:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
          description: |-
            The buyer's own words describing what they want to discuss — the
            counter-offer, the question, the financing problem. Shown to the
            dealer in the inbox card and re-posted as the first chat message on
            accept, so it should read as a message, not a form field.
    ChatAccessRequest:
      type: object
      description: |-
        One buyer's ask to open a chat on one quote. Carries denormalized
        `buyer_display_name` and `vehicle_summary` so the dealer's inbox is a
        single query with no joins on the hot list.
      required:
      - id
      - quote_id
      - request_id
      - buyer_display_name
      - vehicle_summary
      - message
      - status
      - requested_at
      - chat_opened
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
          description: The buyer request behind the quote, for the "back to request" link.
        buyer_display_name:
          type: string
          description: First name plus initial. Not the buyer's full legal name.
        vehicle_summary:
          type: string
          description: Pre-rendered "year make model — price" for the inbox card.
        message:
          type: string
          maxLength: 1000
        status:
          $ref: '#/components/schemas/ChatAccessRequestStatus'
        requested_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        decline_reason:
          type: string
          maxLength: 500
          nullable: true
        chat_opened:
          type: boolean
          description: True only once the dealer accepted; the client uses it to gate the chat tab.
    ChatAccessRequestPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatAccessRequest'
        next_cursor:
          type: string
          nullable: true
        unread_count:
          type: integer
          minimum: 0
          description: Pending requests not yet acted on. Drives the dealer nav badge.
    PresignResult:
      type: object
      required:
      - url
      - key
      - method
      - expires_in
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 PUT. The file never passes through the API server.
        key:
          type: string
          description: |-
            Deterministic `{quote_id}/{epoch_ms}.{ext}`, so a retry overwrites
            rather than accumulating orphans.
          example: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f/1788875882219.pdf
        method:
          type: string
          enum:
          - PUT
        expires_in:
          type: integer
          description: Seconds the presigned URL stays valid
          example: 900
        max_bytes:
          type: integer
          example: 10485760
    DealDocument:
      type: object
      required:
      - id
      - quote_id
      - dealer_id
      - document_type
      - created_at
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        dealer_id:
          type: string
          format: uuid
        document_type:
          type: string
          enum:
          - vehicle_image
          - quote_document
        image_paths:
          type: array
          description: S3 keys for photos and screenshots. Empty array, never null.
          items:
            type: string
        document_path:
          type: string
          description: S3 key for a real file. One document per row.
          nullable: true
        file_name:
          type: string
          description: Sanitized original filename derived from the private S3 key.
          example: buyer-order.pdf
          nullable: true
        content_type:
          type: string
          nullable: true
        download_url:
          type: string
          format: uri
          nullable: true
          description: Short-lived presigned GET URL returned to an authorized quote participant.
        size_bytes:
          type: integer
          nullable: true
        confirmed:
          type: boolean
          description: False until /documents/{id}/confirm has verified the S3 object.
        created_at:
          type: string
          format: date-time
    DealDocumentChecklist:
      type: object
      description: |-
        The five required artefacts and their state. Drives the deal screen's
        progress indicator. `outstanding` is derived server-side so the bar
        and the "what's left" list can never disagree.
      required:
      - quote_id
      - items
      - outstanding
      properties:
        quote_id:
          type: string
          format: uuid
        items:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required:
            - key
            - label
            - satisfied
            properties:
              key:
                type: string
                enum:
                - title_transfer
                - bill_of_sale
                - odometer_disclosure
                - service_records
                - insurance_binder
              label:
                type: string
                example: Title transfer
              satisfied:
                type: boolean
              document_ids:
                type: array
                items:
                  type: string
                  format: uuid
        outstanding:
          type: array
          description: Labels still missing. The client shows this list; it does not recompute it.
          items:
            type: string
    TicketCreateRequest:
      type: object
      required:
      - issue_summary
      properties:
        issue_summary:
          type: string
          minLength: 1
          maxLength: 200
          example: The web page is very slow
        issue_description:
          type: string
          maxLength: 10000
          nullable: true
        issue_type:
          type: string
          enum:
          - bug
          - incorrect_data
          - account_access
          - other
          default: bug
        page_context:
          type: string
          maxLength: 500
          description: App route or screen where the issue was reported.
          nullable: true
        issue_image_url:
          type: string
          format: uri
          description: Screenshot of the fault. Uploaded separately via /documents/presign.
          nullable: true
        priority:
          $ref: '#/components/schemas/TicketPriority'
    SupportTicket:
      type: object
      required:
      - id
      - ticket_id
      - category
      - issue_summary
      - status
      - priority
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          description: |-
            Human reference, unique per category. `TIC-<epoch>` for
            customers, `DS<epoch>` for dealers — UNIQUE (category, ticket_id)
            so the two streams stay separable and a future `internal`
            category can reuse either prefix.
          example: TIC-316519
        category:
          type: string
          enum:
          - customer
          - dealer
          - internal
          description: Derived from the caller's role. **Not accepted from the body.**
        caller_id:
          type: string
          format: uuid
          description: Null if the caller's profile was later deleted; `caller_email` survives for the
            audit trail.
          nullable: true
        caller_email:
          type: string
          format: email
          description: Denormalised so the ticket stays readable after account deletion.
          nullable: true
        caller_name:
          type: string
          description: Display name resolved from the caller profile for support operations.
          nullable: true
        caller_role:
          type: string
          enum:
          - buyer
          - dealer
          - support
          - support-admin
          - admin
          nullable: true
        issue_summary:
          type: string
        issue_description:
          type: string
          nullable: true
        issue_type:
          type: string
          enum:
          - bug
          - incorrect_data
          - account_access
          - other
        page_context:
          type: string
          nullable: true
        issue_image_url:
          type: string
          format: uri
          nullable: true
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        notes:
          type: array
          description: Agent timeline. Append-only — an entry is never edited or removed.
          items:
