      - $ref: '#/components/parameters/ProfileId'
      responses:
        '200':
          description: Support member details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /members/{profile_id}/suspend:
    post:
      summary: Suspend a member
      description: |-
        Support/admin only. Sets `users.is_active = false` and revokes every
        refresh token family, so access dies within one access-token lifetime.
        Their rows are never deleted — the deal history has to stay intact.
      operationId: suspendMember
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Member suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /members/{profile_id}/support-role:
    patch:
      summary: Provision or remove support administrator access
      description: |-
        Support-admin or admin only. Changes a support team member between
        `support` and `support-admin`, clears their refresh token, and causes
        every existing access token to fail its database-role check. The member
        must sign in again to receive controls for the new role.
      operationId: updateSupportMemberRole
      tags:
      - Members
      parameters:
      - $ref: '#/components/parameters/ProfileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - support
                  - support-admin
      responses:
        '200':
          description: Role changed; the target member must sign in again
          content:
            application/json:
              schema:
                type: object
                required:
                - profile_id
                - role
                - requires_sign_in
                properties:
                  profile_id:
                    type: string
                    format: uuid
                  role:
                    type: string
                    enum: [support, support-admin]
                  requires_sign_in:
                    type: boolean
                    enum: [true]
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
