        schema:
          $ref: '#/components/schemas/DecimalString'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of matching requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedRequestList'
              examples:
                page:
                  value:
                    items:
                    - $ref: '#/components/examples/FeedRequest'
                    next_cursor: eyJpZCI6IjAyZTkyYzZhIn0
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /feed/requests/{request_id}:
    get:
      summary: One request from the dealer feed
      description: |-
        The dealer-facing read of a request. Same row as the buyer's view, but
        the buyer snapshot is trimmed to the fields a dealer needs to price it
        — no contact details, no other dealers' quotes, no internal IDs.
      operationId: getFeedRequest
      tags:
      - Dealer Feed
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request as a dealer sees it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /quotes:
    post:
      summary: Quote on a request
      description: |-
        Creates a `deal_quotes` row. Dealer-only, and the dealer must have an
        approved `support_verifications` row — 403 DEALER_PENDING_REVIEW
        otherwise.

        One live quote per (request, dealer) enforced by a partial unique index;
        a second quote for the same pair is 409, not a silent update.

        **final_price is server-computed** as `(price - discount) * (1 +
        sales_tax_rate)`, using the request's state tax rate. Sending
        final_price is 422.

        Buyer requests are specification-only and do not accept buyer photos.
        After this quote exists, the dealer uploads actual vehicle images,
        window stickers, inspection reports and buyer-order documents with
        `/documents/presign` followed by `/documents/{document_id}/confirm`.
        Those quote-scoped files are visible to the buyer from the request
        detail and offer views.
      operationId: createQuote
      tags:
      - Quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreateRequest'
            examples:
              first_offer:
                value:
                  request_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                  price: '62000.00'
                  discount: '2000.00'
                  estimated_delivery_days: 7
                  message: We have a matching 2022 Bronco in stock, fully inspected.
                  car_ids:
                  - 00e22c60-88c0-40ef-a12d-365ecbbd4185
                  valid_until: '2026-10-07 00:00:00+00:00'
      responses:
        '201':
          description: Quote created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '402':
          $ref: '#/components/responses/subscription_required'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
    get:
      summary: List my quotes
      description: Cursor-paginated, newest first. Dealer-only.
      operationId: listMyQuotes
      tags:
      - Quotes
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/QuoteStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteList'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /quotes/{quote_id}:
    get:
      summary: Get one of my quotes
      description: |-
        Dealer-only. The buyer reads the same quote through
        /requests/{request_id}/quotes, which is a trimmed projection.
      operationId: getQuote
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Quote detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /quotes/{quote_id}/revise:
    patch:
      summary: Revise my quote
      description: |-
        Replaces price / discount / delivery estimate on a `pending` quote and
        bumps `revision_count`. The prior values are preserved in
        `deal_quotes.revisions` (jsonb array) — a revision is an append, not an
        overwrite, so a dealer cannot erase a number they already showed a
        buyer.
      operationId: reviseQuote
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteReviseRequest'
            examples:
              improved:
                value:
                  price: '59500.00'
                  discount: '2500.00'
                  estimated_delivery_days: 5
                  message: Improved offer — includes a fresh inspection and 12-month warranty.
      responses:
        '200':
          description: Revised quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
  /quotes/{quote_id}/accept:
    post:
      summary: Accept my quote
      description: |-
        Buyer-only, and only on a `pending` quote whose request is still `open`.
        The accept is a compare-and-set: the losing quotes are marked
        `withdrawn` and the request moves to `matched` in the **same
        transaction**, so two buyers can never accept two quotes on one request.

        Idempotent on the same quote — a retry returns 200 with the same
        `deal_id`, not a 409, because a flaky network must not double-create a
        deal.
      operationId: acceptQuote
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Quote accepted, deal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteAcceptResult'
              examples:
                accepted:
                  value:
                    quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                    deal_id: dce16b4b-7c8d-4e9f-a0b1-c2d3e4f5a6b
                    request_status: matched
                    effective_price: '61485.40'
                    withdrawn_quote_count: 2
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /quotes/{quote_id}/dealer-contact:
    get:
      summary: Reveal the dealer contact for this quote
      description: |-
        Buyer-only. This is the endpoint that puts the dealer's phone, email,
        and business name on the buyer's offer page, and it is **gated** — the
        contact stays hidden until one of these two conditions holds:

        1. The buyer accepted the quote (`status = accepted` or `matched`).
        2. The buyer asked to negotiate, the dealer accepted that chat request,
           and the quote is `negotiating`.

        Before either condition, this is 403 `DEALER_CONTACT_WITHHELD` — a
        distinct code so the client can render "accept the offer or request
        contact to see dealer details" instead of a generic failure.

        The chat icon on the buyer's offer page is driven by
        `contact_available` in this response, so the two never disagree: no
        contact means no chat icon.
      operationId: getQuoteDealerContact
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Dealer contact unlocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerContact'
              examples:
                unlocked:
                  value:
                    quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                    contact_available: true
                    unlocked_by: accepted_quote
                    dealer_profile_id: bdc31c9e-f6ed-40d0-a32f-706062f81d77
                    display_name: Ridgeway Motors
                    avatar_url: https://cdn.drivedeal.example/avatars/bdc31c9e.jpg
                    business_name: Ridgeway Motors LLC
                    phone: '+15550142288'
                    email: deals@ridgewaymotors.example
                    is_verified_dealer: true
                    average_response_minutes: 18
                    chat_url: /api/v1/ws?ticket=<one-shot ticket from POST /chats/ws-ticket>
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          description: Contact still withheld
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                withheld:
                  value:
                    error:
                      code: DEALER_CONTACT_WITHHELD
                      message: Accept the offer or request a chat to see dealer contact details.
                      details:
                        quote_status: pending
                        chat_request_status: null
        '404':
          $ref: '#/components/responses/not_found'
  /quotes/{quote_id}/decline:
    post:
      summary: Decline my quote
      description: Buyer-only. Moves the quote to `declined`; the request stays open.
      operationId: declineQuote
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Quote declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSummary'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /quotes/{quote_id}/withdraw:
    post:
      summary: Withdraw my quote
      description: |-
        Dealer-only, `pending` → `withdrawn`. Allowed even after the buyer has
        opened a chat — the chat row is soft-cleared on the dealer side, not
        deleted (solution-backend.md §9.4).
      operationId: withdrawQuote
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/QuoteId'
      responses:
        '200':
          description: Quote withdrawn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSummary'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /deals:
    get:
      summary: List my deals
      description: |-
        Deals where the caller is the buyer or the winning dealer. Cursor
        pagination, newest activity first.
      operationId: listMyDeals
      tags:
      - Deals
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of deals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealList'
        '401':
          $ref: '#/components/responses/unauthorized'
  /deals/{quote_id}:
    get:
      summary: Get a deal
      description: |-
        Only the buyer and the winning dealer may read. Returns the accepted
        quote, the originating request, both parties' profiles, the document
        checklist state, and the full status history.
      operationId: getDeal
      tags:
      - Deals
      parameters:
      - $ref: '#/components/parameters/DealId'
      responses:
        '200':
          description: Deal detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /deals/{quote_id}/status:
    patch:
      summary: Advance the deal status
      description: |-
        Walks the deal through its lifecycle:
        `matched → negotiation → payment_pending → payment_confirmed →
        documents_pending → completed`, with `cancelled` reachable from
        `matched`, `negotiation` and `payment_pending`.

        **The transition is validated server-side against the current status** —
        an out-of-order or illegal jump is 409 CONFLICT with the legal
        next states in `details.allowed_transitions`, so the UI can disable
        buttons from the response instead of duplicating the state machine.

        Every transition appends to `deal_quotes.deal_history` (jsonb) and
        broadcasts a WS `deal_status` event, so a second open tab cannot show a
        stale status.
      operationId: updateDealStatus
      tags:
      - Deals
      parameters:
      - $ref: '#/components/parameters/DealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  $ref: '#/components/schemas/DealStatus'
                note:
                  type: string
                  maxLength: 1000
            examples:
              buyer_confirms_payment:
                value:
                  status: payment_confirmed
                  note: Bank transfer reference shared in chat.
      responses:
        '200':
          description: Status advanced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/ws-ticket:
    post:
      summary: Mint a one-shot WebSocket ticket
      description: |-
        Browsers cannot set an Authorization header on a WebSocket handshake, so
        the client POSTs here with its bearer token and receives a 60-second
        single-use `ticket`. GET /ws then authenticates with
        `?ticket=...`.

        The ticket is invalidated on first use, so a captured URL cannot be
        replayed.
      operationId: createWsTicket
      tags:
      - Realtime
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required:
                - ticket
                - expires_in
                properties:
                  ticket:
                    type: string
                  expires_in:
                    type: integer
                    example: 60
        '401':
          $ref: '#/components/responses/unauthorized'
  /chats/requests:
    get:
      summary: List chat access requests
      description: |-
        Two audiences, one collection, because the dealer inbox and the buyer's
        sent folder are the same rows read with a different filter:

        - **Dealer** sees `pending` requests addressed to them, newest first.
        - **Buyer** sees their own requests in any state, so the UI can show
          "waiting on dealer" then flip to "dealer accepted" without a second
          endpoint.

        Filter with `status`; omit it for the role default described above.
        Buyers can never see another buyer's requests, and a dealer can never
        see a request for a quote they did not answer.
      operationId: listChatRequests
      tags:
      - Chat
      parameters:
      - name: status
        in: query
        required: false
        description: Defaults to `pending` for dealers and to all states for buyers.
        schema:
          $ref: '#/components/schemas/ChatAccessRequestStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Chat access requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAccessRequestPage'
              examples:
                dealerInbox:
                  value:
                    items:
                    - id: 9c1f0a52-7b3d-4a68-9e21-4f0a5b6c7d8e
                      quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                      request_id: 6b8e2d31-0c47-4f19-8a55-1d2e3f4a5b6c
                      buyer_display_name: Sam R.
                      vehicle_summary: 2021 Toyota RAV4 XLE — $27,400
                      message: The car is still available? I can pay cash today but the
                        price is above my budget. Could you meet me at $25,500?
                      status: pending
                      requested_at: '2026-09-09T17:31:02Z'
                      responded_at: null
                      chat_opened: false
                    next_cursor: null
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /chats/requests/{quote_id}/accept:
    post:
      summary: Accept a chat access request
      description: |-
        Dealer-only. This is the moment the connection opens: the request moves
        to `accepted`, the quote moves to `negotiating`, `deal_chats` is created
        for that quote, the buyer's dealer contact is unlocked, and a
        `chat_request` frame plus a `chat_message` frame (carrying the request
        text as the first message) are pushed over the WebSocket.

        All of it in one transaction — the dealer never sees "accepted" in the
        UI while the buyer's chat is still closed.

        Idempotent: re-accepting an already-accepted request returns 200 with
        the same `quote_id` instead of 409, so a double tap is harmless.
      operationId: acceptChatRequest
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatRequestId'
      responses:
        '200':
          description: Request accepted, chat open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAccessRequest'
              examples:
                accepted:
                  value:
                    id: 9c1f0a52-7b3d-4a68-9e21-4f0a5b6c7d8e
                    quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                    request_id: 6b8e2d31-0c47-4f19-8a55-1d2e3f4a5b6c
                    buyer_display_name: Sam R.
                    vehicle_summary: 2021 Toyota RAV4 XLE — $27,400
                    message: The car is still available? I can pay cash today but the price
                      is above my budget. Could you meet me at $25,500?
                    status: accepted
                    requested_at: '2026-09-09T17:31:02Z'
                    responded_at: '2026-09-09T17:44:19Z'
                    chat_opened: true
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/requests/{quote_id}/decline:
    post:
      summary: Decline a chat access request
      description: |-
        Dealer-only. Moves the request to `declined`, leaves the quote exactly as
        it was, and unlocks nothing. The buyer keeps the original offer and can
        still accept it or submit one new request later.

        Optional `reason` is shown verbatim to the buyer, so it is the dealer's
        only chance to explain the refusal.
      operationId: declineChatRequest
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatRequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  description: Free text shown to the buyer.
            examples:
              declined:
                value:
                  reason: That unit is already under a deposit hold with another buyer.
      responses:
        '200':
          description: Request declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAccessRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/{quote_id}:
    get:
      summary: List messages in a quote's chat
      description: |-
        Ascending by `created_at`. Soft-delete is per-side: a message the
        opponent cleared is filtered out of *your* read, but the row is never
        deleted, so clearing a chat cannot rewrite history on the other side.

        Gated — the chat exists only after one of two events, and 403
        `CHAT_NOT_OPEN` before either:

        1. The buyer accepted the quote. No request needed; the dealer is
          already a party to the deal.
        2. The buyer called POST /chats/{quote_id}/request-access and the dealer
          accepted it.

        Until then the buyer has no chat to read, which is what keeps the
        marketplace honest: you cannot read a dealer's replies before you have
        either committed or been given permission.
      operationId: listMessages
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  next_cursor:
                    type: string
                    nullable: true
              examples:
                thread:
                  value:
                    items:
                    - id: 05fd4db1-df75-4305-b766-66cf289f208c
                      quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                      sender_id: bdc31c9e-f6ed-40d0-a32f-706062f81d77
                      sender_role: buyer
                      message: Hi, I'm ready with my funds arrangement. I'll be financing the remaining
                        balance.
                      created_at: '2026-09-09 17:28:46+00:00'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
    post:
      summary: Send a message
      description: |-
        Either party to the quote, and only once the chat is open — 403
        `CHAT_NOT_OPEN` otherwise (see GET /chats/{quote_id} for the two ways it
        opens). The dealer's contact stays hidden until the same moment, so a
        buyer cannot post their way past the gate.

        HTTP fallback for the WS `chat.send` frame, and it calls the *same*
        service, so authorization, dedupe, and persistence cannot drift between
        the two transports. A duplicate `id` is a no-op that still returns 201,
        so a client retry after a dropped connection never double-posts.

        Broadcasts a WS `chat_message` event to the other side only after the
        row has been persisted.
      operationId: sendMessage
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - message
              properties:
                id:
                  type: string
                  format: uuid
                  description: Client-generated; persisted as `deal_chats.id` for optimistic UI and dedupe.
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
            examples:
              ask:
                value:
                  id: 05fd4db1-df75-4305-b766-66cf289f208c
                  message: Can you share the vehicle history report?
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/{quote_id}/request-access:
    post:
      summary: Ask the dealer to open a chat
      description: |-
        Buyer-only, and the negotiation branch of the chat lifecycle. Used when
        the buyer does **not** want to accept the offer as-is: they send a
        description of what they want to discuss and the dealer decides.

        Creates a `pending` chat access request and notifies the dealer over the
        WebSocket. **No chat exists yet** — `GET/POST /chats/{quote_id}` is
        403 `CHAT_NOT_OPEN` until the dealer accepts, so the buyer cannot talk
        into a void. The quote status is left untouched; only
        POST /chats/requests/{id}/accept moves it to `negotiating`.

        Re-asking while one is already `pending` is idempotent and returns the
        existing request with 200, not a duplicate with 409 — a double tap or a
        retry on a flaky connection must not spam the dealer.

        409 only when the quote is already `accepted` or `withdrawn`, where a
        chat request is meaningless: the deal already exists or the offer is
        gone. For an accepted quote the buyer just opens the chat directly.
      operationId: requestChatAccess
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatAccessRequestCreate'
            examples:
              ask:
                value:
                  message: The car is still available? I can pay cash today but the price
                    is above my budget. Could you meet me at $25,500?
      responses:
        '201':
          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAccessRequest'
              examples:
                pending:
                  value:
                    id: 9c1f0a52-7b3d-4a68-9e21-4f0a5b6c7d8e
                    quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                    request_id: 6b8e2d31-0c47-4f19-8a55-1d2e3f4a5b6c
                    buyer_display_name: Sam R.
                    vehicle_summary: 2021 Toyota RAV4 XLE — $27,400
                    message: The car is still available? I can pay cash today but the price
                      is above my budget. Could you meet me at $25,500?
                    status: pending
                    requested_at: '2026-09-09T17:31:02Z'
                    responded_at: null
                    chat_opened: false
        '200':
          description: A pending request already existed; returned unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAccessRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/{quote_id}/request-negotiation:
    post:
      summary: Buyer asks to reopen a declined quote
      description: |-
        Buyer-only. Moves the quote to `negotiating`, notifies the dealer, and
        appends to `deal_history`. The dealer still owns the accept/decline
        decision — this is a request, not an acceptance.
      operationId: requestNegotiation
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '201':
          description: Negotiation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegotiationRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /chats/{quote_id}/read:
    post:
      summary: Mark a chat as read up to a message
      description: |-
        Stamps `buyer_last_read_at` or `dealer_last_read_at`. Only ever moves
        the cursor forward — a stale client re-reporting an older message is
        ignored rather than rewinding the unread badge.

        HTTP fallback for the WS `chat.read` frame. The dealer counterpart is
        pushed as a `chat_read` frame, which is what drives the blue ticks.
      operationId: markChatRead
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - last_read_message_id
              properties:
                last_read_message_id:
                  type: string
                  format: uuid
                  description: Highest message id the caller has rendered.
            examples:
              read:
                value:
                  last_read_message_id: 05fd4db1-df75-4305-b766-66cf289f208c
      responses:
        '200':
          description: Read cursor advanced
          content:
            application/json:
              schema:
                type: object
                required:
                - quote_id
                - cleared_side
                - last_read_at
                properties:
                  quote_id:
                    type: string
                    format: uuid
                  cleared_side:
                    type: string
                    enum:
                    - buyer
                    - dealer
                  last_read_at:
                    type: string
                    format: date-time
                  unread_count:
                    type: integer
                    minimum: 0
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /chats/{quote_id}/clear:
    delete:
      summary: Clear my side of a chat
      description: |-
        Soft-clears only the caller's side by stamping
        `buyer_chat_cleared_at` or `dealer_chat_cleared_at`. No row is ever
        deleted; the opponent's view is unaffected.
      operationId: clearChat
      tags:
      - Chat
      parameters:
      - $ref: '#/components/parameters/ChatQuoteId'
      responses:
        '200':
          description: Side cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatClearResult'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /documents/local/{key}:
    put:
      summary: Upload directly to the local storage driver
      description: |-
        The non-S3 upload path, used when `STORAGE_DRIVER=local`. The body is
        the raw file bytes with no envelope, and the key is a caller-chosen path
        (it may contain `/`). Returns 204 with no body.
      operationId: uploadLocalDocument
      tags:
      - Documents
      parameters:
      - name: key
        in: path
        required: true
        description: Destination path, relative to the upload directory
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Stored
        '404':
          $ref: '#/components/responses/not_found'
    get:
      summary: Download from the local storage driver
      description: |-
        The non-S3 download path. `key` may contain `/`.
      operationId: downloadLocalDocument
      tags:
      - Documents
      parameters:
      - name: key
        in: path
        required: true
        description: Path, relative to the upload directory
        schema:
          type: string
      responses:
        '200':
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/not_found'
  /documents/presign:
    post:
      summary: Get an S3 upload URL
      description: |-
        Returns a presigned PUT and the S3 key the client must upload to. The
        file is **not** stored by Deal&Drive — it never touches the API server.

        Keys are scoped to `{quote_id}/{dealer_id}` and retain a sanitized
        original filename after a UUID prefix. The server verifies quote
        ownership, media type, declared size, and per-quote limits before
        issuing the short-lived URL.
      operationId: presignUpload
      tags:
      - Documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quote_id
              - filename
              - content_type
              - size_bytes
              - document_type
              properties:
                quote_id:
                  type: string
                  format: uuid
                filename:
                  type: string
                  maxLength: 255
                  example: service-records.pdf
                content_type:
                  type: string
                  enum:
                  - application/pdf
                  - image/jpeg
                  - image/png
                  - image/webp
                size_bytes:
                  type: integer
                  minimum: 1
                  maximum: 20971520
                document_type:
                  type: string
                  description: |-
                    `vehicle_image` permits up to eight JPG, PNG, or WebP files.
                    `quote_document` permits one PDF, DOC, or DOCX file.
                  enum:
                  - vehicle_image
                  - quote_document
            examples:
              pdf:
                value:
                  quote_id: 2fa7ac94-1b3c-4d5e-8f90-1a2b3c4d5e6f
                  filename: service-records.pdf
                  content_type: application/pdf
                  size_bytes: 2411004
                  document_type: quote_document
      responses:
        '200':
          description: Presigned URL and key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignResult'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_error'
        '429':
          $ref: '#/components/responses/rate_limited'
  /documents/{document_id}/confirm:
    post:
      summary: Confirm an upload
      description: |-
        Called after the client PUTs the bytes. Verifies the object key belongs
        to the quote and dealer, normalizes legacy attachment types, enforces
        eight-photo/one-document limits, then confirms the `deal_documents` row.
      operationId: confirmUpload
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/DocumentConfirmId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id, document_type, object_key]
              properties:
                quote_id:
                  type: string
                  format: uuid
                document_type:
                  type: string
                  enum: [vehicle_image, quote_document]
                object_key:
                  type: string
      responses:
        '201':
          description: Document record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealDocument'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '422':
          $ref: '#/components/responses/validation_error'
  /documents/{quote_id}:
    get:
      summary: List a deal's documents
      operationId: listDocuments
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/QuoteDocId'
      responses:
        '200':
          description: Documents for the quote
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DealDocument'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /documents/{quote_id}/{document_id}:
    delete:
      summary: Delete a document
      description: |-
        Deletes the S3 object and the row together. Dealers only, and only
        before the deal reaches `completed` — a completed deal's paperwork is
        an audit artefact.
      operationId: deleteDocument
      tags:
      - Documents
      parameters:
      - $ref: '#/components/parameters/QuoteDocId'
      - $ref: '#/components/parameters/DocumentId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /support/tickets:
    post:
      summary: Raise a support ticket
      description: |-
        `category` is derived from the caller's role, never accepted from the
        body — a dealer cannot file into the customer stream. `ticket_id` is
        generated server-side: `TIC-<epoch>` for customers, `DS<epoch>` for
        dealers.
      operationId: createTicket
      tags:
      - Support
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
            examples:
              slow_site:
                value:
                  issue_summary: The web page is very slow
                  issue_description: Pages take 8+ seconds since yesterday evening.
                  priority: medium
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '401':
          $ref: '#/components/responses/unauthorized'
        '422':
          $ref: '#/components/responses/validation_error'
    get:
      summary: List my tickets
      description: |-
        Callers see only their own tickets (`caller_id = me`). Cursor
        pagination.
      operationId: listMyTickets
      tags:
      - Support
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TicketStatus'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
        '401':
          $ref: '#/components/responses/unauthorized'
  /support/tickets/{ticket_id}:
    get:
      summary: Get a ticket
      description: |-
        The caller who raised it, or a support/admin agent. A dealer's ticket is
        scoped to `category = 'dealer'`, so the two streams stay separated.
      operationId: getTicket
      tags:
      - Support
      parameters:
      - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
    patch:
      summary: Update my own ticket
      description: |-
        Partial update - only the fields you send change. `status` moves the
        ticket along the queue, `note` appends a progress note, and `rca`
        captures the root cause when a ticket is being closed.

        Scoped to the caller who raised it, so a buyer cannot edit a dealer's
        ticket. The response is the whole updated `SupportTicket`, not just the
        fields you changed.
      operationId: updateTicket
      tags:
      - Support
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /support/workspaces/{workspace}/requests:
    get:
      summary: Preview marketplace requests as a buyer or dealer
      description: |-
        Read-only operational workspace for support administrators. It renders
        the real buyer/dealer frontend without impersonating a member. Only
        `support-admin` and `admin` roles may call it; marketplace mutations
        remain protected by their original buyer/dealer role checks.
      operationId: previewSupportWorkspaceRequests
      tags:
      - Support
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          enum:
          - buyer
          - dealer
      responses:
        '200':
          description: Requests visible in the selected operational preview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuyerRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /support/workspaces/{workspace}/quotes:
    get:
      summary: Preview marketplace quotes as a buyer or dealer
      description: |-
        Read-only quote projection for the support-administrator workspace
        switcher. Sensitive write actions remain unavailable.
      operationId: previewSupportWorkspaceQuotes
      tags:
      - Support
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          enum:
          - buyer
          - dealer
      responses:
        '200':
          description: Quotes visible in the selected operational preview
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteDetail'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /support/queue/tickets:
    get:
      summary: Support agent work queue
      description: |-
        Support/admin only. The agent's home view: all tickets, ordered by
        priority then age, with the SLA clock. `category` defaults to
        `customer` so an agent working the customer queue does not see dealer
        tickets unless they ask.
      operationId: getSupportQueue
      tags:
      - Support
      parameters:
      - name: category
        in: query
        schema:
          type: string
          enum:
          - customer
          - dealer
          - internal
          default: customer
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TicketStatus'
      - name: assigned_to
        in: query
        description: Restrict to one agent
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketList'
              examples:
                queue:
                  value:
                    items:
                    - $ref: '#/components/examples/TicketNew'
                    - $ref: '#/components/examples/TicketInProgress'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /support/queue/tickets/{ticket_id}:
    patch:
      summary: Update a ticket from the queue
      description: |-
        Support/admin only. Appends to `notes` (a jsonb timeline, never
        overwritten) and may set `rca`. Resolving a ticket sets
        `resolved_at`; closing it sets `closed_at`.
      operationId: updateQueuedTicket
      tags:
      - Support
      parameters:
      - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueTicketUpdateRequest'
            examples:
              agent_note:
                value:
                  status: in-progress
                  assigned_to: 4772bb1a-ee75-4f45-b8e6-53d70f6e42b1
                  note:
                    text: Reproduced on staging — DB query missing the brand index.
      responses:
        '200':
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicket'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/validation_error'
  /verifications:
    get:
      summary: List verification requests
      description: |-
        Support/admin only. Defaults to `status = 'pending'`, because the
        actionable work is always what is waiting on a human.
      operationId: listVerifications
      tags:
      - Verifications
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/VerificationStatus'
      - name: category
        in: query
        schema:
          type: string
          enum:
          - dealer
          - agent
          - customer
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of verifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationList'
              examples:
                pending:
                  value:
                    items:
                    - $ref: '#/components/examples/VerificationPending'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /verifications/{verification_id}/approve:
    post:
      summary: Approve a verification
      description: |-
        The single gate that makes an account usable. Approving a **dealer**
        verification sets `users.is_active = true` and `verified_at` in the same
        transaction, so the dealer's next login succeeds and their quotes can
        start flowing. `email_sent` flips to true once the notification is out.

        **Support agents may approve dealer verifications only. Approving an
        `agent` verification requires the `admin` role** — 403
        INSUFFICIENT_ROLE for a support agent. Agents cannot approve peers.
      operationId: approveVerification
      tags:
      - Verifications
      parameters:
      - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
            examples:
              approve_dealer:
                value:
                  reason: License TX030202 verified against the state registry.
      responses:
        '200':
          description: Verification approved, account activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /verifications/{verification_id}/deny:
    post:
      summary: Deny a verification
      description: |-
        Support/admin only, same role rule as approve. The account stays
        inactive; the applicant is emailed the reason and may apply again.
      operationId: denyVerification
      tags:
      - Verifications
      parameters:
      - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
            examples:
              deny:
                value:
                  reason: Dealership licence number does not match the state registry.
      responses:
        '200':
          description: Verification denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /verifications/{verification_id}/reject:
    post:
      summary: Reject a verification
      description: |-
        Support/admin only, with the same role rule as approve. This is the
        explicit hard-rejection action used when submitted evidence is invalid
        or the applicant is ineligible. A reason is required for the audit
        timeline; the account remains inactive.
      operationId: rejectVerification
      tags:
      - Verifications
      parameters:
      - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
            examples:
              reject:
                value:
                  reason: Submitted licence belongs to a different legal entity.
      responses:
        '200':
          description: Verification rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /members:
    get:
      summary: List support members
      description: |-
