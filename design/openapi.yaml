      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestList'
              examples:
                one_open:
                  value:
                    items:
                    - $ref: '#/components/examples/RequestOpen'
                    next_cursor: null
        '401':
          $ref: '#/components/responses/unauthorized'
  /requests/{request_id}:
    get:
      summary: Get one of my requests
      description: |-
        Buyer-only: 403 for anyone but the owning buyer. Includes the quote
        count so the list row and the detail header agree.
