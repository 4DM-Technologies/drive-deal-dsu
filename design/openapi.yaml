        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
  /requests/{request_id}/publish:
    post:
      summary: Publish an AI-drafted request
      description: |-
        **The human-in-the-loop gate.** Moves `draft → open`, which is the only
        way a request becomes visible in any dealer feed.

        No LangGraph node can call this. The AI's write surface to
        buyer_requests is `draft` only; a test asserts no graph path can reach
        `status = 'open'` (solution-backend.md §10.6).
      operationId: publishRequest
      tags:
      - Requests
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request is now open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /requests/{request_id}/close:
    post:
      summary: Close one of my requests
      description: |-
        Buyer-only, terminal transition. `open → closed`, or `open → matched` for
        the buyer who already accepted a quote. Withdrawing every outstanding
        quote is a side effect of matching, done in the same transaction.
      operationId: closeRequest
      tags:
      - Requests
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Request closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '409':
          $ref: '#/components/responses/conflict'
  /requests/{request_id}/quotes:
    get:
      summary: Live quote leaderboard for a request
      description: |-
        Every quote on the request, ordered by the composite score the frontend
        renders: `effective_price` ascending, tie-broken by
        `buyer_chat_cleared_at` (dealer's messages visible) then
        `seller_rating` descending.

        Only the owning buyer may read this — it exposes dealer pricing.
      operationId: listRequestQuotes
      tags:
      - Quotes
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IncludeWithdrawn'
      responses:
        '200':
          description: Quotes ordered best-first
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuoteSummary'
              examples:
