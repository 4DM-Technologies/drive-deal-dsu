          minLength: 1
          maxLength: 120
        body_type:
          allOf:
          - $ref: '#/components/schemas/BodyType'
          nullable: true
        seating_capacity:
          type: integer
          minimum: 1
          maximum: 15
          description: |-
            A fact about this specific car, and what a buyer's
            `seater_count` is matched against. Newer than the live CSVs, so
            it is null on migrated rows until the dealer or the advisor
            pipeline fills it — and null means "no constraint", not "zero
            seats".
          nullable: true
        condition:
          allOf:
          - $ref: '#/components/schemas/CarCondition'
          nullable: true
        mileage:
          type: integer
