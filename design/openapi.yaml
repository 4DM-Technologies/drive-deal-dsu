          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
  /members/{profile_id}:
    get:
      summary: Get one support member
      description: |-
        Support, support-admin, or admin only. Returns the selected support
        member’s contact details, role, account state, and last sign-in for the
        roster details panel. Buyer and dealer profiles are deliberately not
        exposed through this route.
      operationId: getSupportMember
      tags:
      - Members
