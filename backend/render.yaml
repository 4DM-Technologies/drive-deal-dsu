services:
  - type: web
    name: drivedeal-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/docs
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: DriveDeal API
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: CORS_ORIGINS
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: OPENAI_API_KEY
        sync: false
      - key: CODEX_OAUTH_ACCESS_TOKEN
        sync: false
      - key: CODEX_OAUTH_CLIENT_ID
        sync: false
      - key: CODEX_OAUTH_REFRESH_TOKEN
        sync: false
      - key: CODEX_OAUTH_S3_PREFIX
        value: private/codex-oauth
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: AI_PROVIDER
        value: openai
      - key: AI_DISABLED
        value: "false"
      - key: AI_ENABLE_WEB_SEARCH
        value: "false"
      - key: AI_MAX_INPUT_TOKENS
        value: "12000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "45"
