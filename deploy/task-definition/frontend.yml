# Env contract for the DriveDeal web container.
#
# The deployment workflow loads these public URLs from the frontend-config
# Secrets Manager JSON secret and passes them directly to the Vite build.
# They are public configuration; Vite embeds them in the browser bundle.
#
# These are URLs, not credentials. Both are required: frontend/src/config/environment.ts
# throws at module load if either is blank, and a wrong localhost value would
# point the browser at the visitor's own machine.

env:
  # Full API path through the public CloudFront distribution.
  # e.g. https://your-cloudfront-domain/api/v1
  - key: VITE_API_BASE_URL
    required: true

  # Same CloudFront distribution using the secure WebSocket scheme:
  # e.g. wss://your-cloudfront-domain/api/v1/ws
  - key: VITE_WS_BASE_URL
    required: true
