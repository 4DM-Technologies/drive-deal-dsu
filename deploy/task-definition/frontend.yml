# Env contract for the DriveDeal web container.
#
# scripts/generate_env.py reads these public GitHub repository variables and
# writes frontend/.env.production for the Vite build. These are URLs, never
# credentials; Vite embeds them in the browser bundle.
#
# These are URLs, not secrets, so set them as repository variables rather than
# repository secrets. Both are required: frontend/src/config/environment.ts
# throws at module load if either is blank, and a wrong localhost value would
# point the browser at the visitor's own machine.

env:
  # Full API path through the public CloudFront distribution.
  # e.g. https://your-cloudfront-domain/api/v1
  - key: VITE_API_BASE_URL
    required: true

  # Same CloudFront distribution using the secure WebSocket scheme:
  # e.g. wss://your-cloudfront-domain/api/v1/ws
  - key: VITE_WS_BASE_URL
    required: true
