services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/drivedeal.db
      AUTO_SEED_DEMO: "true"
    volumes:
      - drivedeal-data:/app/data
      - drivedeal-uploads:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCKS: "false"
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_WS_BASE_URL: ws://localhost:8000/api/v1/ws
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  drivedeal-data:
  drivedeal-uploads:
