# Local-only container topology: the API is published on 8000 and the built
# frontend is published on 80. AWS deployment uses S3/CloudFront for the frontend
# and ECS/Fargate for the API; it does not upload this local env file.
name: drive-deal-dsu

services:
  backend:
    build:
      context: ./backend
    # Local development only. ECS receives production settings from its task
    # definition and Secrets Manager; do not upload this file during deployment.
    # Values are not repeated under `environment:` because compose would let
    # those override env_file.
    env_file:
      - ./backend/.env
    volumes:
      - drivedeal-data:/app/data
      - drivedeal-uploads:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000/api/v1/ws}
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Explicit names keep local development data stable across Compose project
  # directory renames. These volumes are local and are not used by ECS.
  drivedeal-data:
    name: drive-deal-dsu-data
  drivedeal-uploads:
    name: drive-deal-dsu-uploads
